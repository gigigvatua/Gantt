
<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ავეჯის საწარმოს Gantt ცხრილი (ონლაინ, Supabase)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#EDEAE0;
  --panel:#FFFFFF;
  --ink:#211E1A;
  --ink-soft:#6B665C;
  --line:#DCD6C8;
  --line-soft:#EAE6DA;
  --blueprint:#2E4A5C;
  --mdf:#C99B5E;
  --mdf-dark:#A87D45;
  --rust:#B5502F;
  --sage:#5C7A6B;
  --stone:#9B968C;
  --danger:#B5502F;
  --radius:8px;
  --sidebar-w:560px;
  --day-w:30px;
}
html{height:100%;}
*{box-sizing:border-box;}
body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{
  max-width:100%;
  margin:0 auto;
  padding:20px 24px 20px;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
}

/* ---- Header ---- */
.topbar{
  display:flex;justify-content:space-between;align-items:flex-end;
  margin-bottom:22px;flex-wrap:wrap;gap:16px;
}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.logo-img{
  height:58px;width:auto;border-radius:14px;flex-shrink:0;
  box-shadow:0 1px 3px rgba(0,0,0,.15);
}
.title-block h1{
  font-family:'Space Grotesk',sans-serif;
  font-size:26px;font-weight:700;margin:0 0 4px;
  letter-spacing:-.01em;
}
.title-block p{margin:0;color:var(--ink-soft);font-size:13.5px;}
.title-block .tag{
  display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;
  background:var(--blueprint);color:#fff;padding:2px 8px;border-radius:3px;
  letter-spacing:.03em;margin-bottom:8px;
}
.btn{
  font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;
  border:none;border-radius:6px;padding:10px 16px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:transform .1s, box-shadow .15s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--blueprint);color:#fff;}
.btn-primary:hover{box-shadow:0 3px 10px rgba(46,74,92,.35);}
.btn-ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink-soft);}
.btn-icon{
  width:28px;height:28px;padding:0;border-radius:5px;border:1px solid var(--line);
  background:var(--panel);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
}
.btn-icon:hover{background:var(--line-soft);}
.btn-icon.danger:hover{background:#f5e3dd;border-color:var(--rust);}

/* ---- Stats ---- */
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:8px;padding-left:16px;border-left:1px solid var(--line);}

/* ---- View tabs ---- */
.view-tabs{display:flex;gap:8px;margin-bottom:14px;}
.view-tab{
  font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
  padding:9px 18px;border-radius:7px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-soft);cursor:pointer;transition:all .12s;
}
.view-tab:hover{border-color:var(--ink-soft);color:var(--ink);}
.view-tab.active{background:var(--blueprint);color:#fff;border-color:var(--blueprint);}
#tabActive{background:#E11D2E;color:#fff;border-color:#E11D2E;}
#tabCompleted{background:#16A34A;color:#fff;border-color:#16A34A;}
#btnNavTasks{background:#7B2CBF;color:#fff;border-color:#7B2CBF;}
#btnNavFinance{background:#C9A227;color:#fff;border-color:#C9A227;}
.tab-count{
  display:inline-block;margin-left:5px;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;
  background:rgba(0,0,0,.15);padding:1px 6px;border-radius:10px;
}

.page-nav{display:flex;gap:6px;}
.page-nav-btn{
  display:flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;
  padding:9px 14px;border-radius:7px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-soft);cursor:pointer;transition:all .12s;
}
.page-nav-btn:hover{border-color:var(--ink-soft);color:var(--ink);}
.page-nav-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.stat-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:6px 12px;min-width:90px;
}
.stat-card .num{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;}
.stat-card .lbl{font-size:10.5px;color:var(--ink-soft);margin-top:1px;}

/* ---- Toolbar ---- */
.toolbar{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-bottom:12px;flex-wrap:wrap;
}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:7px 12px;min-width:240px;
}
.search-box input{
  border:none;outline:none;font-family:'Inter',sans-serif;font-size:13.5px;
  width:100%;background:transparent;color:var(--ink);
}
.search-box svg{flex-shrink:0;opacity:.5;}

/* ---- Gantt wrap ---- */
#ganttPage{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;}
.gantt-wrap{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow:auto;position:relative;
  flex:1 1 auto;min-height:0;
}
.gantt-inner{position:relative;width:max-content;min-width:100%;}

/* ---- Finance page ---- */
.finance-summary{
  display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;
  position:sticky;top:0;z-index:4;background:var(--bg);padding:6px 0 10px;
}
.finance-stat{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 20px;flex:1;min-width:160px;
}
.finance-stat .fs-lbl{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
.finance-stat .fs-val{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;}
.finance-stat.profit .fs-val.positive{color:var(--sage);}
.finance-stat.profit .fs-val.negative{color:var(--rust);}
.finance-table-wrap{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow:visible;
}
.finance-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.finance-table th{
  position:sticky;top:0;z-index:3;background:var(--panel);
  text-align:left;padding:11px 14px;border-bottom:2px solid var(--line);
  font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;
  color:var(--ink-soft);letter-spacing:.03em;white-space:nowrap;
  box-shadow:0 1px 0 var(--line);
}
.th-total{
  font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;
  text-transform:none;letter-spacing:0;color:var(--ink);margin-top:3px;
}
.finance-table td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
.finance-editable{cursor:text;}
.finance-editable:hover{background:var(--line-soft);}
.finance-budget-input{
  width:100px;box-sizing:border-box;font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:700;text-align:right;
  border:1px solid var(--blueprint);border-radius:4px;padding:3px 6px;background:#fff;
}
.finance-table tbody tr:hover{background:var(--line-soft);}
.finance-table .num-cell{font-family:'JetBrains Mono',monospace;text-align:right;white-space:nowrap;}
.finance-table th.num-cell{text-align:right;}
.finance-profit-positive{color:var(--sage);font-weight:700;}
.pay-check{color:var(--sage);font-weight:700;margin-left:3px;}
.payment-checkbox-row{display:flex;align-items:center;gap:8px;margin:8px 0 14px;}
.payment-checkbox-row label{font-size:13px;color:var(--ink);display:flex;align-items:center;gap:6px;cursor:pointer;}
.payment-checkbox-row input[type=checkbox]{width:16px;height:16px;cursor:pointer;}
.finance-profit-negative{color:var(--rust);font-weight:700;}
.finance-order-name{font-weight:600;}
.finance-order-client{font-size:11.5px;color:var(--ink-soft);}

.expense-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.expense-row{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  border:1px solid var(--line);border-radius:6px;background:#fbfaf6;
}
.expense-row .exp-desc{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text;border-radius:3px;padding:2px 4px;margin:-2px -4px;}
.expense-row .exp-desc:hover{background:var(--line-soft);}
.expense-row .exp-amt{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:var(--rust);cursor:text;border-radius:3px;padding:2px 4px;margin:-2px -4px;}
.expense-row .exp-amt:hover{background:var(--line-soft);}
.exp-desc-input{
  flex:1;min-width:0;font-size:12.5px;font-family:inherit;border:1px solid var(--blueprint);border-radius:3px;padding:2px 4px;background:#fff;
}
.exp-amt-input{
  width:80px;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:var(--rust);
  border:1px solid var(--blueprint);border-radius:3px;padding:2px 4px;background:#fff;
}
.expense-add-row{display:flex;gap:8px;align-items:flex-end;}
.expense-add-row .field{flex:1;margin-bottom:0;}
.expense-add-row input{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;
}

.row{display:flex;border-bottom:1px solid var(--line-soft);}
.row:last-child{border-bottom:none;}

.side{
  position:sticky;left:0;z-index:3;width:var(--sidebar-w);flex-shrink:0;
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:0 10px;
}
.side.head{z-index:6;}

.timeline{position:relative;flex-shrink:0;}

/* header */
.head-row{position:sticky;top:0;z-index:4;background:var(--panel);}
.ruler{position:relative;}
.ruler-months{display:flex;height:26px;border-bottom:1px solid var(--line);}
.ruler-month{
  flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink-soft);
  display:flex;align-items:center;padding-left:6px;border-right:1px dashed var(--line);
  letter-spacing:.02em;
}
.ruler-days{display:flex;height:30px;}
.ruler-day{
  flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line-soft);
  position:relative;
}
.ruler-day::before{
  content:"";position:absolute;top:0;left:50%;width:1px;height:4px;background:var(--line);
}
.ruler-day.weekend{background:var(--line-soft);}
.ruler-day.today{background:#f2ded3;color:var(--rust);font-weight:700;}

/* order / task rows */
.order-row .side{height:56px;background:#fbfaf6;}
.task-row .side{height:44px;}
.furniture-group-row{background:#f2ede0;}
.furniture-group-row .side{height:34px;background:#f2ede0;border-right:1px solid var(--line);gap:6px;}
.furniture-group-label{
  font-size:14px;font-weight:700;color:var(--mdf-dark);text-transform:uppercase;letter-spacing:.03em;
}
.order-row .timeline{height:56px;}
.task-row .timeline{height:44px;}

.chev{
  width:22px;height:22px;flex-shrink:0;border:none;background:transparent;cursor:pointer;
  color:var(--ink-soft);display:flex;align-items:center;justify-content:center;transition:transform .15s;
}
.chev.collapsed{transform:rotate(-90deg);}
.chev svg{width:15px;height:15px;}

.row-num{
  flex-shrink:0;width:30px;text-align:right;font-family:'JetBrains Mono',monospace;
  font-size:13px;font-weight:700;color:var(--ink-soft);
}
.row-num.sub-num{width:34px;font-size:12px;font-weight:600;color:var(--stone);}

.name-block{flex:1;min-width:0;}
.name-block .nm{
  font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.name-block .sub{
  font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.task-row .name-block .nm{font-weight:500;font-size:14px;}

.name-block .nm .note-dot{font-size:12px;cursor:help;}
.badge{
  font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;
  padding:3px 10px;border-radius:4px;color:#fff;white-space:nowrap;letter-spacing:.02em;
  box-shadow:0 1px 2px rgba(0,0,0,.25);
}
.row-actions{display:flex;gap:4px;flex-shrink:0;}

/* bars */
.bar{
  position:absolute;top:9px;border-radius:5px;overflow:hidden;cursor:pointer;
  box-shadow:0 2px 4px rgba(0,0,0,.28);border:1px solid rgba(0,0,0,.22);
  min-width:6px;transition:filter .1s;
}
.bar-resize-handle{
  position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:5;
}
.bar-resize-handle.left{left:0;}
.bar-resize-handle.right{right:0;}
.bar-resize-handle:hover{background:rgba(255,255,255,.4);}
.bar.resizing{transition:none;filter:brightness(1.08);}
.order-row .bar{height:38px;}
.task-row .bar{height:26px;top:9px;}
.bar:hover{filter:brightness(1.06);}
.bar .edge{position:absolute;top:0;left:0;right:0;height:5px;}
.bar .lbl{
  position:absolute;inset:6px 6px 0;font-size:13px;font-weight:700;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 3px rgba(0,0,0,.8), 0 0 6px rgba(0,0,0,.4);
  letter-spacing:.01em;
}
.task-row .bar .lbl{
  font-size:12px;inset:5px 5px 0;color:var(--ink);font-weight:700;
  text-shadow:0 1px 2px rgba(255,255,255,.85), 0 0 5px rgba(255,255,255,.6);
}
.bar.task-bar{border-width:2px;}

.today-line{
  position:absolute;top:0;width:0;border-left:2px dashed var(--rust);z-index:2;pointer-events:none;
}
.today-tag{
  position:absolute;font-family:'JetBrains Mono',monospace;font-size:9px;color:#fff;
  background:var(--rust);padding:1px 5px;border-radius:3px;top:52px;transform:translateX(-50%);white-space:nowrap;
}

.empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);}
.empty-state svg{opacity:.35;margin-bottom:10px;}

/* ---- Login screen ---- */
#loginScreen{
  position:fixed;inset:0;background:var(--bg);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
#loginScreen.hidden{display:none;}
.login-card{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  width:100%;max-width:380px;padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.12);
}
.login-card h1{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 6px;}
.login-card p{color:var(--ink-soft);font-size:13px;margin:0 0 22px;}
.login-card .field{margin-bottom:14px;}
.login-card .field label{
  display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.03em;
}
.login-card input{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;
  font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);background:#fff;
}
.login-card input:focus{outline:none;border-color:var(--blueprint);}
.login-card .btn{width:100%;justify-content:center;padding:11px;margin-top:6px;}
.login-err{color:var(--rust);font-size:12.5px;margin-top:10px;display:none;}
.login-toggle{
  text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:16px;
}
.login-toggle a{color:var(--blueprint);cursor:pointer;font-weight:600;text-decoration:none;}

/* ---- User / role badge in topbar ---- */
.user-badge{
  display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-soft);
}
.user-badge .role-pill{
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:3px 8px;
  border-radius:4px;color:#fff;letter-spacing:.02em;
}

/* ---- Modal ---- */
.overlay{
  position:fixed;inset:0;background:rgba(33,30,26,.5);display:none;
  align-items:center;justify-content:center;z-index:50;padding:20px;
}
.overlay.open{display:flex;}
.preview-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;
  align-items:center;justify-content:center;z-index:200;padding:20px;
}
.preview-overlay.open{display:flex;}
.preview-box{
  background:var(--panel);border-radius:10px;width:100%;max-width:480px;
  max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.preview-box:fullscreen{
  max-width:100%;width:100%;height:100%;max-height:100%;border-radius:0;
  display:flex;flex-direction:column;background:#111;
}
.preview-box:fullscreen .modal-head{background:#111;border-color:#333;color:#fff;}
.preview-box:fullscreen .modal-head .btn-icon{color:#fff;}
.preview-box:fullscreen .modal-body{
  flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;
}
.preview-box:fullscreen .modal-body img{width:auto;max-width:100%;max-height:100%;object-fit:contain;}
.preview-box:fullscreen .modal-body iframe{width:100%;height:100%;}
.modal{
  background:var(--panel);border-radius:10px;width:100%;max-width:480px;
  max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal-head{
  padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
}
.modal-head h3{margin:0;font-family:'Space Grotesk',sans-serif;font-size:17px;}
.modal-body{padding:20px 22px;}
.field{margin-bottom:15px;}
.field label{
  display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.03em;
}
.field input[type=text],.field select,.field input[type=date],.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;
  font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);background:#fff;
}
.field textarea{resize:vertical;min-height:60px;font-family:'Inter',sans-serif;}
.field input[type=text]:focus,.field select:focus,.field input[type=date]:focus,.field textarea:focus{
  outline:none;border-color:var(--blueprint);
}
.row2{display:flex;gap:12px;}
.row2 .field{flex:1;}
.color-row{display:flex;align-items:flex-start;gap:10px;}
.color-row input[type=color]{
  width:44px;height:34px;border:1px solid var(--line);border-radius:6px;padding:2px;cursor:pointer;background:#fff;
}
.swatches{display:flex;gap:6px;flex-wrap:wrap;max-width:230px;}
.swatch{
  width:22px;height:22px;border-radius:5px;cursor:pointer;border:2px solid transparent;
}
.swatch.active{border-color:var(--ink);}
.err{color:var(--rust);font-size:12px;margin-top:4px;display:none;}
.modal-foot{
  padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:-8px;margin-bottom:14px;}

/* ---- Tasks & Assignments page ---- */
.wt-list-wrap{display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1 1 auto;min-height:0;padding-right:2px;}
.wt-employee-group{
  background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:14px;margin-bottom:4px;
}
.wt-employee-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--line);
}
.wt-employee-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--ink);}
.wt-employee-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);}
.wt-employee-tasks{display:flex;flex-direction:column;gap:8px;}
.wt-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;display:flex;align-items:flex-start;gap:14px;
}
.wt-card.done{opacity:.55;}
.wt-check{width:22px;height:22px;flex-shrink:0;margin-top:2px;cursor:pointer;}
.wt-main{flex:1;min-width:0;}
.wt-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px;}
.wt-title{font-weight:700;font-size:14.5px;}
.wt-type{font-size:11.5px;color:var(--ink-soft);}
.wt-meta-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-top:8px;}
.wt-priority-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;color:#fff;}
.wt-status-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;color:#fff;}
.wt-progress-wrap{display:flex;align-items:center;gap:6px;}
.wt-progress-bar{width:110px;height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden;}
.wt-progress-fill{height:100%;background:var(--blueprint);}
.wt-actions{display:flex;gap:6px;flex-shrink:0;align-items:center;}
.wt-due-overdue{color:var(--rust);font-weight:700;}
.wt-employee-select{
  font-size:12px;padding:3px 6px;border-radius:4px;border:1px solid var(--line);background:#fff;color:var(--ink);
}
.wt-order-link{
  font-size:12px;font-weight:600;color:var(--blueprint);background:#e8eef2;border-radius:6px;
  padding:4px 9px;margin-top:6px;display:inline-block;cursor:pointer;transition:background .12s;
}
.wt-order-link:hover{background:#d7e2e9;}
.wt-inline-notes{
  font-size:12.5px;color:var(--ink);background:var(--bg);border-radius:6px;
  padding:6px 10px;margin-top:6px;white-space:pre-wrap;
}
.wt-inline-comments{
  margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
  display:flex;flex-direction:column;gap:6px;
}
.wt-inline-comment{background:var(--bg);border-radius:6px;padding:7px 10px;}
.wt-comment-row{padding:8px 0;border-bottom:1px solid var(--line-soft);}
.wt-comment-row:last-child{border-bottom:none;}
.wt-comment-author{font-weight:700;font-size:12px;}
.wt-comment-date{font-size:10.5px;color:var(--ink-soft);margin-left:6px;}
.wt-comment-text{font-size:13px;margin-top:2px;white-space:pre-wrap;}


/* ---- Attachments ---- */
.attachments-list{display:flex;flex-direction:column;gap:6px;}
.attachment-row{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  border:1px solid var(--line);border-radius:6px;background:#fbfaf6;
}
.attachment-row .att-name{
  flex:1;min-width:0;font-size:12.5px;font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
}
.attachment-row .att-name:hover{color:var(--blueprint);text-decoration:underline;}
.attachment-row .att-size{font-size:11px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;flex-shrink:0;}

/* ============================================================
   RESPONSIVE / MOBILE
   ============================================================ */
@media (max-width: 768px){
  :root{ --sidebar-w:220px; }

  .app{ padding:12px 12px 10px; }

  .topbar{ align-items:flex-start; gap:10px; }
  .brand{ gap:10px; }
  .logo-img{ height:40px; }
  .title-block h1{ font-size:18px; }
  .title-block p{ font-size:11px; }
  .title-block p span{ display:block; margin-top:2px; }

  #btnNewOrder span.label{ display:none; }
  .btn{ padding:9px 12px; font-size:12.5px; }

  .user-badge{ font-size:11px; gap:6px; }
  .user-badge .role-pill{ font-size:9px; padding:2px 6px; }

  .stats{ gap:6px; margin:2px 0 0; padding-left:0; border-left:none; flex-basis:100%; }
  .stat-card{ flex:1 1 auto; min-width:86px; padding:8px 10px; }
  .stat-card .num{ font-size:16px; }
  .stat-card .lbl{ font-size:10px; }

  .view-tabs{ gap:6px; margin-bottom:10px; }
  .view-tab{ flex:1; text-align:center; padding:8px 6px; font-size:11.5px; }

  .toolbar{ flex-direction:column; align-items:stretch; gap:8px; }
  .search-box{ min-width:0; width:100%; }
  .toolbar > div:last-child{ width:100%; justify-content:space-between; }

  .side{ padding:0 6px; gap:5px; }
  .task-row .side{ padding-left:22px; }
  .name-block .nm{ font-size:13px; }
  .name-block .sub{ font-size:11px; }
  .badge{ font-size:9.5px; padding:2px 6px; }
  .btn-icon{ width:30px; height:30px; }
  .row-actions{ gap:2px; }

  .modal{ max-width:100%; }
  .overlay{ padding:0; align-items:flex-end; }
  .modal{ border-radius:14px 14px 0 0; max-height:92vh; max-height:92dvh; }
  .row2{ flex-direction:column; gap:0; }
  .modal-body{ padding:16px 16px; }
  .modal-head{ padding:14px 16px; }
  .modal-foot{ padding:12px 16px; }

  .login-card{ padding:24px 20px; }
}

@media (max-width: 480px){
  :root{ --sidebar-w:170px; }
  .order-row .side{ height:58px; }
  .task-row .side{ height:46px; }
  .order-row .bar{ height:38px; }
  .task-row .bar{ height:26px; }
  .name-block .sub{ display:none; }
  .title-block p{ font-size:10px; }
  .stat-card{ min-width:70px; padding:7px 8px; }
  .stat-card .num{ font-size:14px; }
}
</style>
</head>

function toISO(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }

/* Lightens a hex color toward white by `amt` (0-1). Used so sub-task bars
   read as a clearly softer/lighter version of a color, distinct from the
   bold, full-strength color used for the parent order's bar. */
function lightenColor(hex, amt){
  if(!hex) return hex;
  let h = hex.replace('#','');
  if(h.length === 3) h = h.split('').map(c=>c+c).join('');
  const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  if(isNaN(r) || isNaN(g) || isNaN(b)) return hex;
  const nr = Math.round(r + (255-r)*amt);
  const ng = Math.round(g + (255-g)*amt);
  const nb = Math.round(b + (255-b)*amt);
  return `rgb(${nr},${ng},${nb})`;
}

/* ---------- Data layer (shared Postgres tables via Supabase) ---------- */
function rowToOrder(o){
  return {
    id:o.id, name:o.name, client:o.client||'', client_phone:o.client_phone||'', client_address:o.client_address||'',
    start:o.start_date, end:o.end_date,
    color:o.color, status:o.status, responsible:o.responsible||'', notes:o.notes||'', tasks:[], furnitureItems:[]
  };
}
function rowToTask(t, attCount){
  return {
    id:t.id, title:t.title||'', stage:t.stage, start:t.start_date, end:t.end_date,
    color:t.color, status:t.status, employee:t.employee||'', notes:t.notes||'',
    quantity:t.quantity||'', contractor:t.contractor||'', furniture_unit:t.furniture_unit||'',
    attachmentCount: attCount || 0
  };
}

async function loadData(){
  updateStatusText('იტვირთება...');
  try{
    const [{ data: orderRows, error: oErr }, { data: taskRows, error: tErr }, { data: attRows, error: aErr }, { data: furnitureRows, error: fuErr }] = await Promise.all([
      sb.from('orders').select('*').order('seq', { ascending:true }),
      sb.from('tasks').select('*').order('seq', { ascending:true }),
      sb.from('task_attachments').select('task_id'),
      sb.from('order_furniture_items').select('*').order('seq', { ascending:true })
    ]);
    if(oErr) throw oErr;
    if(tErr) throw tErr;
    if(aErr) throw aErr;
    if(fuErr) throw fuErr;

    const attCounts = {};
    (attRows||[]).forEach(r=>{ attCounts[r.task_id] = (attCounts[r.task_id]||0) + 1; });

    const byId = {};
    orders = orderRows.map(o=>{ const ord = rowToOrder(o); byId[ord.id] = ord; return ord; });
    taskRows.forEach(t=>{ const ord = byId[t.order_id]; if(ord) ord.tasks.push(rowToTask(t, attCounts[t.id])); });
    (furnitureRows||[]).forEach(fi=>{
      const ord = byId[fi.order_id];
      if(ord) ord.furnitureItems.push({ id: fi.id, name: fi.name, volume: fi.volume||'', color: fi.color||'' });
    });

    orders.forEach(o=>{ if(expanded[o.id] === undefined) expanded[o.id] = false; });
    updateStatusText(`დაკავშირებულია (${orders.length} შეკვეთა)`);
    render();
  }catch(e){
    console.error(e);
    updateStatusText('მონაცემების ჩატვირთვა ვერ მოხერხდა: ' + (e.message||''));
  }
}

function subscribeRealtime(){
  if(realtimeChannel) sb.removeChannel(realtimeChannel);

async function saveOrder(payload, existingId){
  const row = {
    name: payload.name, client: payload.client,
    client_phone: payload.client_phone, client_address: payload.client_address,
    start_date: payload.start, end_date: payload.end,
    color: payload.color, status: payload.status, responsible: payload.responsible, notes: payload.notes,
    updated_at: new Date().toISOString()
  };
  if(existingId){
    const { error } = await sb.from('orders').update(row).eq('id', existingId);
    if(error) throw error;
    /* keep every sub-task's color in sync with the order — tasks don't have
       their own color picker, they always mirror the parent order's color */
    const { error: taskColorErr } = await sb.from('tasks').update({ color: payload.color }).eq('order_id', existingId);
    if(taskColorErr) console.error('sub-task color sync failed:', taskColorErr);
    return existingId;
  } else {
    row.created_by = currentUser.id;
    const { data, error } = await sb.from('orders').insert(row).select().single();
    if(error) throw error;
    return data.id;
  }
}

function formatFileSize(bytes){
  if(!bytes && bytes !== 0) return '';
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

/* ---------- Finance page (admin/manager only) ---------- */
function formatMoney(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('ka-GE', { maximumFractionDigits: 2 }) + ' ₾';
}
function formatNumber(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('ka-GE', { maximumFractionDigits: 2 });
}

async function loadFinanceData(){
  try{
    const [{ data: financeRows, error: fErr }, { data: expenseRows, error: eErr }, { data: advanceRows, error: aErr }] = await Promise.all([
      sb.from('order_finance').select('*'),
      sb.from('order_expenses').select('*').order('created_at', { ascending:true }).order('id', { ascending:true }),
      sb.from('order_advance_payments').select('*').order('created_at', { ascending:true }).order('id', { ascending:true })
    ]);
    if(fErr) throw fErr;
    if(eErr) throw eErr;
    if(aErr) throw aErr;

    financeData = {};
    orders.forEach(o=>{
      financeData[o.id] = { budget_total: null, furniture_size: null, advancePayments: [], advance_received: false, final_received: false, expenses: [] };
    });
    (financeRows||[]).forEach(r=>{
      if(!financeData[r.order_id]) financeData[r.order_id] = { budget_total:null, furniture_size:null, advancePayments:[], advance_received:false, final_received:false, expenses:[] };
      financeData[r.order_id].budget_total = r.budget_total;
      financeData[r.order_id].furniture_size = r.furniture_size;
      financeData[r.order_id].advance_received = !!r.advance_received;
      financeData[r.order_id].final_received = !!r.final_received;
    });
    (expenseRows||[]).forEach(e=>{
      if(!financeData[e.order_id]) financeData[e.order_id] = { budget_total:null, furniture_size:null, advancePayments:[], advance_received:false, final_received:false, expenses:[] };
      financeData[e.order_id].expenses.push({ id:e.id, description:e.description, amount:e.amount });
    });
    (advanceRows||[]).forEach(a=>{
      if(!financeData[a.order_id]) financeData[a.order_id] = { budget_total:null, furniture_size:null, advancePayments:[], advance_received:false, final_received:false, expenses:[] };
      financeData[a.order_id].advancePayments.push({ id:a.id, description:a.description, amount:a.amount });
    });
  }catch(e){
    console.error('Finance load failed:', e);
    alert('ფინანსური მონაცემების ჩატვირთვა ვერ მოხერხდა: ' + (e.message||''));
  }
}

function calcExpensesTotal(orderId){
  const fd = financeData[orderId];
  if(!fd) return 0;
  return fd.expenses.reduce((sum,e)=> sum + (Number(e.amount)||0), 0);
}
function calcAdvanceTotal(orderId){
  const fd = financeData[orderId];
  if(!fd || !fd.advancePayments) return 0;
  return fd.advancePayments.reduce((sum,a)=> sum + (Number(a.amount)||0), 0);
}

function renderFinancePage(){
  const bodyEl = document.getElementById('financeTableBody');
  if(!bodyEl) return;

  let totalBudget = 0, totalExpenses = 0, totalRemaining = 0, totalAdvanceCash = 0, totalAdvance = 0;
  const rowsHtml = orders.map((o, idx)=>{
    const fd = financeData[o.id] || { budget_total:null, furniture_size:null, advancePayments:[], advance_received:false, final_received:false, expenses:[] };
    const expTotal = calcExpensesTotal(o.id);
    const budget = Number(fd.budget_total) || 0;
    const advance = calcAdvanceTotal(o.id);
    const remaining = budget - advance;
    const advanceCash = advance - expTotal;
    const profit = budget - expTotal;
    if(o.status !== 'დასრულებული'){ totalBudget += budget; totalExpenses += expTotal; totalRemaining += remaining; totalAdvanceCash += advanceCash; totalAdvance += advance; }
    const profitClass = profit > 0 ? 'finance-profit-positive' : (profit < 0 ? 'finance-profit-negative' : '');
    const advanceCashClass = advanceCash > 0 ? 'finance-profit-positive' : (advanceCash < 0 ? 'finance-profit-negative' : '');
    const finalIcon = fd.final_received ? '✓' : '';
    return `<tr>
      <td>${idx+1}</td>
      <td>
        <div class="finance-order-name">${escapeHtml(o.name)}
          <button class="btn-icon" data-print-report="${o.id}" title="ფინანსური ანგარიშის ბეჭდვა" style="margin-left:6px;vertical-align:middle;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2M6 14h12v7H6z"/></svg>
          </button>
        </div>
        <div class="finance-order-client">${escapeHtml(o.client)}</div>
      </td>
      <td><span class="badge" style="background:${STATUS_COLOR[o.status]||'#9B968C'}">${o.status}</span></td>
      <td class="num-cell finance-editable" data-budget-edit="${o.id}" title="დააჭირეთ რედაქტირებისთვის">${fd.budget_total !== null ? formatMoney(fd.budget_total) : '—'}</td>
      <td class="num-cell">
        ${advance > 0 ? formatMoney(advance) : '—'}
        <button class="btn-icon" data-advance-edit="${o.id}" title="ავანსების რედაქტირება">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
      </td>
      <td class="num-cell">
        ${expTotal > 0 ? formatMoney(expTotal) : '—'}
        <button class="btn-icon" data-expenses-edit="${o.id}" title="ხარჯების რედაქტირება">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
      </td>
      <td class="num-cell ${advanceCashClass}">${advance > 0 ? formatMoney(advanceCash) : '—'}</td>
      <td class="num-cell">${budget > 0 ? formatMoney(remaining) : '—'} ${finalIcon ? '<span class="pay-check" title="საბოლოო გადახდა მიღებულია">'+finalIcon+'</span>' : ''}</td>
      <td class="num-cell ${profitClass}">${(fd.budget_total !== null || expTotal>0) ? formatMoney(profit) : '—'}</td>
    </tr>`;
  }).join('');

  const totalProfit = totalBudget - totalExpenses;

  const thBudget = document.getElementById('thTotalBudget');
  const thAdvance = document.getElementById('thTotalAdvance');
  const thExpenses = document.getElementById('thTotalExpenses');
  const thAdvanceCash = document.getElementById('thTotalAdvanceCash');
  const thRemaining = document.getElementById('thTotalRemaining');
  const thProfit = document.getElementById('thTotalProfit');
  if(thBudget) thBudget.textContent = formatMoney(totalBudget);
  if(thAdvance) thAdvance.textContent = formatMoney(totalAdvance);
  if(thExpenses) thExpenses.textContent = formatMoney(totalExpenses);
  if(thAdvanceCash){ thAdvanceCash.textContent = formatMoney(totalAdvanceCash); thAdvanceCash.style.color = totalAdvanceCash>=0 ? 'var(--sage)' : 'var(--rust)'; }
  if(thRemaining) thRemaining.textContent = formatMoney(totalRemaining);
  if(thProfit){ thProfit.textContent = formatMoney(totalProfit); thProfit.style.color = totalProfit>=0 ? 'var(--sage)' : 'var(--rust)'; }

  bodyEl.innerHTML = rowsHtml || `<tr><td colspan="9" style="text-align:center;color:var(--ink-soft);padding:30px;">შეკვეთები არ არის</td></tr>`;

  bodyEl.querySelectorAll('[data-advance-edit]').forEach(el=>{
    el.onclick = ()=> openAdvancePaymentsModal(el.getAttribute('data-advance-edit'));
  });
  bodyEl.querySelectorAll('[data-expenses-edit]').forEach(el=>{
    el.onclick = ()=> openExpensesModal(el.getAttribute('data-expenses-edit'));
  });
  bodyEl.querySelectorAll('[data-print-report]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); printOrderFinanceReport(el.getAttribute('data-print-report')); };
  });
  bodyEl.querySelectorAll('[data-budget-edit]').forEach(el=>{
    el.onclick = ()=>{
      const orderId = el.getAttribute('data-budget-edit');
      const fd = financeData[orderId] || {};
      const currentVal = (fd.budget_total !== null && fd.budget_total !== undefined) ? fd.budget_total : '';
      const input = document.createElement('input');
      input.type = 'number'; input.step = '0.01'; input.value = currentVal;
      input.className = 'finance-budget-input';
      el.innerHTML = '';
      el.appendChild(input);
      input.focus(); input.select();

      let done = false;
      const commit = async ()=>{
        if(done) return;
        done = true;
        try{
          await saveOrderFinance(
            orderId,
            input.value,
            fd.furniture_size !== null && fd.furniture_size !== undefined ? fd.furniture_size : '',
            fd.advance_received,
            fd.final_received
          );
          await loadFinanceData();
          renderFinancePage();
        }catch(e){ alert('შენახვა ვერ მოხერხდა: ' + (e.message||'')); renderFinancePage(); }
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', ev=>{
        if(ev.key === 'Enter'){ ev.preventDefault(); input.blur(); }
        else if(ev.key === 'Escape'){ done = true; renderFinancePage(); }
      });
    };
  });
}

async function switchPage(page){
  if(page === 'finance' && !isAdmin()) return;
  currentPageView = page;

  document.getElementById('ganttPage').style.display = page === 'gantt' ? 'flex' : 'none';
  document.getElementById('financePage').style.display = page === 'finance' ? 'block' : 'none';
  document.getElementById('tasksPage').style.display = page === 'tasks' ? 'flex' : 'none';

  document.getElementById('btnNavTasks').classList.toggle('active', page === 'tasks');
  document.getElementById('btnNavFinance').classList.toggle('active', page === 'finance');

  if(page === 'gantt'){
    render();
  } else if(page === 'finance'){
    updateStatusText('');
    await loadFinanceData();
    renderFinancePage();
  } else if(page === 'tasks'){
    updateStatusText('');
    await loadWorkTasks();
    renderTasksPage();
  }
}

async function saveOrderFinance(orderId, budgetTotal, furnitureSize, advanceReceived, finalReceived){
  const row = {
    order_id: orderId,
    budget_total: budgetTotal === '' ? null : Number(budgetTotal),
    furniture_size: furnitureSize === '' ? null : Number(furnitureSize),
    advance_received: !!advanceReceived,
    final_received: !!finalReceived,
    updated_at: new Date().toISOString()
  };
  const { error } = await sb.from('order_finance').upsert(row, { onConflict:'order_id' });
  if(error) throw error;
}

async function addExpenseEntry(orderId, description, amount){
  const { error } = await sb.from('order_expenses').insert({
    order_id: orderId, description, amount: Number(amount), created_by: currentUser.id
  });
  if(error) throw error;
}

async function deleteExpenseEntry(expenseId){
  const { error } = await sb.from('order_expenses').delete().eq('id', expenseId);
  if(error) throw error;
}

async function updateExpenseEntry(expenseId, description, amount){
  const { error } = await sb.from('order_expenses').update({ description, amount: Number(amount) || 0 }).eq('id', expenseId);
  if(error) throw error;
}

function makeEditableMoneyList(opts){
  const { listElId, getItems, updateFn, deleteFn, emptyText, deleteConfirmText } = opts;
  function renderList(){
    const listEl = document.getElementById(listElId);
    if(!listEl) return;
    const items = getItems();
    if(!items.length){
      listEl.innerHTML = `<div class="hint" style="margin:0;">${emptyText}</div>`;
      return;
    }
    listEl.innerHTML = items.map(it=>`
      <div class="expense-row" data-item-id="${it.id}">
        <span class="exp-desc" data-edit-desc="${it.id}" title="დააჭირეთ რედაქტირებისთვის — ${escapeHtml(it.description)}">${escapeHtml(it.description)}</span>
        <span class="exp-amt" data-edit-amt="${it.id}" title="დააჭირეთ რედაქტირებისთვის">${formatMoney(it.amount)}</span>
        <button type="button" class="btn-icon danger" data-item-delete="${it.id}" title="წაშლა">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-1 0v14H9V6"/></svg>
        </button>
      </div>
    `).join('');

    function startEditing(spanEl, itemId, field){
      const it = items.find(x=>x.id === itemId);
      if(!it) return;
      const currentValue = field === 'description' ? it.description : it.amount;
      const input = document.createElement('input');
      input.type = field === 'amount' ? 'number' : 'text';
      if(field === 'amount') input.step = '0.01';
      input.value = currentValue;
      input.className = field === 'amount' ? 'exp-amt-input' : 'exp-desc-input';
      spanEl.replaceWith(input);
      input.focus();
      input.select();

      let done = false;
      const commit = async ()=>{
        if(done) return;
        done = true;
        const newDesc = field === 'description' ? input.value.trim() || it.description : it.description;
        const newAmt = field === 'amount' ? input.value : it.amount;
        try{
          await updateFn(itemId, newDesc, newAmt);
          await loadFinanceData();
          renderList();
          renderFinancePage();
        }catch(err){ alert('განახლება ვერ მოხერხდა: ' + (err.message||'')); renderList(); }
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', ev=>{
        if(ev.key === 'Enter'){ ev.preventDefault(); input.blur(); }
        else if(ev.key === 'Escape'){ done = true; renderList(); }
      });
    }

    listEl.querySelectorAll('[data-edit-desc]').forEach(el=>{
      el.onclick = ()=> startEditing(el, el.getAttribute('data-edit-desc'), 'description');
    });
    listEl.querySelectorAll('[data-edit-amt]').forEach(el=>{
      el.onclick = ()=> startEditing(el, el.getAttribute('data-edit-amt'), 'amount');
    });
    listEl.querySelectorAll('[data-item-delete]').forEach(el=>{
      el.onclick = async ()=>{
        if(!confirm(deleteConfirmText)) return;
        try{
          await deleteFn(el.getAttribute('data-item-delete'));
          await loadFinanceData();
          renderList();
          renderFinancePage();
        }catch(e){ alert('წაშლა ვერ მოხერხდა: ' + (e.message||'')); }
      };
    });
  }
  renderList();
  return renderList;
}

/* ============================================================================
   TASKS & ASSIGNMENTS (independent of orders)
   ============================================================================ */
const WT_ATTACHMENTS_BUCKET = 'work-task-attachments';

function isMyWorkTask(task){
  return currentProfile && currentProfile.role === 'employee' &&
         currentProfile.employee_name && task.employee === currentProfile.employee_name;
}
function canEditWorkTask(task){
  return canEdit() || isMyWorkTask(task);
}

async function loadWorkTasks(){
  try{
    const [{ data: taskRows, error: tErr }, { data: commentRows, error: cErr }, { data: attRows, error: aErr }, { data: profileRows, error: pErr }] = await Promise.all([
      sb.from('work_tasks').select('*').order('due_date', { ascending:true, nullsFirst:false }).order('id', { ascending:true }),
      sb.from('work_task_comments').select('*').order('created_at', { ascending:true }).order('id', { ascending:true }),
      sb.from('work_task_attachments').select('*').order('created_at', { ascending:true }).order('id', { ascending:true }),
      sb.from('profiles').select('id, display_name, email')
    ]);
    if(tErr) throw tErr;
    if(cErr) throw cErr;
    if(aErr) throw aErr;
    if(pErr) throw pErr;

    const nameById = {};
    (profileRows||[]).forEach(p=>{ nameById[p.id] = p.display_name || p.email || 'უცნობი'; });

    workTasks = (taskRows||[]).map(t=>({
      id:t.id, title:t.title, task_type:t.task_type, employee:t.employee||'',
      priority:t.priority, due_date:t.due_date, status:t.status, progress:t.progress||0,
      notes:t.notes||'', comments:[], attachments:[],
      order_id: t.order_id || '', furniture_unit: t.furniture_unit || '',
      created_by_name: t.created_by ? (nameById[t.created_by] || 'უცნობი') : 'უცნობი'
    }));
    const byId = {};
    workTasks.forEach(t=> byId[t.id] = t);
    (commentRows||[]).forEach(c=>{
      const t = byId[c.work_task_id];
      if(t) t.comments.push({ id:c.id, author_name:c.author_name, text:c.comment_text, created_at:c.created_at });
    });
    (attRows||[]).forEach(a=>{
      const t = byId[a.work_task_id];
      if(t) t.attachments.push({ id:a.id, file_path:a.file_path, file_name:a.file_name, file_size:a.file_size });
    });
  }catch(e){
    console.error('Work tasks load failed:', e);
    updateStatusText('დავალებების ჩატვირთვა ვერ მოხერხდა: ' + (e.message||''));
  }
}

function populateWorkTaskFilters(){
  const empSel = document.getElementById('wtEmployeeFilter');
  const statSel = document.getElementById('wtStatusFilter');
  empSel.innerHTML = '<option value="all">ყველა თანამშრომელი</option>' +
    EMPLOYEES.map(e=>`<option value="${escapeHtml(e)}">${escapeHtml(e)}</option>`).join('');
  statSel.innerHTML = '<option value="all">ყველა სტატუსი</option>' +
    WORK_STATUSES.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
  empSel.onchange = ()=>{ wtEmployeeFilter = empSel.value; renderTasksPage(); };
  statSel.onchange = ()=>{ wtStatusFilter = statSel.value; renderTasksPage(); };
  document.getElementById('wtSearchInput').addEventListener('input', renderTasksPage);
}

function isOverdue(task){
  if(!task.due_date || task.status === 'დასრულებული' || task.status === 'გაუქმებული') return false;
  return parseISO(task.due_date) < todayLocal();
}

function renderTasksPage(){
  const wrap = document.getElementById('wtListWrap');
  if(!wrap) return;
  const query = (document.getElementById('wtSearchInput').value||'').trim().toLowerCase();

  const filtered = workTasks.filter(t=>{
    if(!canEdit() && !isMyWorkTask(t)) {
      /* employees still see all tasks for team visibility, per Gantt pattern */
    }
    const matchesEmp = wtEmployeeFilter === 'all' || t.employee === wtEmployeeFilter;
    const matchesStatus = wtStatusFilter === 'all' || t.status === wtStatusFilter;
    const matchesQuery = !query || t.title.toLowerCase().includes(query) || t.task_type.toLowerCase().includes(query);
    return matchesEmp && matchesStatus && matchesQuery;
  });

  if(filtered.length === 0){
    wrap.innerHTML = `<div class="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <div>დავალება ვერ მოიძებნა</div>
    </div>`;
    return;
  }

  /* Group tasks by assigned employee, in EMPLOYEES order, unassigned last */
  const groups = [];
  const groupIndex = {};
  EMPLOYEES.forEach(name=>{ groupIndex[name] = { name, tasks: [] }; });
  const unassigned = { name: 'დაუნიშნავი', tasks: [] };
  filtered.forEach(t=>{
    if(t.employee && groupIndex[t.employee]) groupIndex[t.employee].tasks.push(t);
    else if(t.employee){ if(!groupIndex[t.employee]) groupIndex[t.employee] = { name:t.employee, tasks:[] }; groupIndex[t.employee].tasks.push(t); }
    else unassigned.tasks.push(t);
  });
  EMPLOYEES.forEach(name=>{ if(groupIndex[name].tasks.length) groups.push(groupIndex[name]); });
  Object.keys(groupIndex).forEach(name=>{ if(!EMPLOYEES.includes(name) && groupIndex[name].tasks.length) groups.push(groupIndex[name]); });
  if(unassigned.tasks.length) groups.push(unassigned);

  function renderTaskCard(t){
    const done = t.status === 'დასრულებული';
    const overdue = isOverdue(t);
    const canEditThis = canEditWorkTask(t);
    const dueLabel = t.due_date ? formatGeorgianDate(t.due_date) : 'ვადა არ არის';
    return `<div class="wt-card ${done?'done':''}" data-wt-id="${t.id}">
      <input type="checkbox" class="wt-check" ${done?'checked':''} data-wt-done="${t.id}" ${canEditThis?'':'disabled'} title="დასრულებულია">
      <div class="wt-main">
        <div class="wt-title-row">
          <span class="wt-title">${escapeHtml(t.title)}</span>
          <span class="wt-priority-badge" style="background:${PRIORITY_COLOR[t.priority]||'#6B7280'}">${escapeHtml(t.priority)}</span>
          <span class="wt-status-badge" style="background:${WORK_STATUS_COLOR[t.status]||'#6B7280'}">${escapeHtml(t.status)}</span>
        </div>
        <div class="wt-type">${escapeHtml(t.task_type)} · დანიშნა: ${escapeHtml(t.created_by_name)}</div>
        ${t.order_id ? (()=>{
          const linkedOrder = orders.find(o=>o.id===t.order_id);
          if(!linkedOrder) return '';
          return `<div class="wt-order-link" data-jump-to-order="${linkedOrder.id}" title="გადასვლა Gantt-ში">
            🔗 ${escapeHtml(linkedOrder.name)}${t.furniture_unit ? ' · 🪑 '+escapeHtml(t.furniture_unit) : ''}
          </div>`;
        })() : ''}
        ${t.notes ? `<div class="wt-inline-notes">📝 ${escapeHtml(t.notes)}</div>` : ''}
        <div class="wt-meta-row">
          <span class="${overdue?'wt-due-overdue':''}">📅 ${dueLabel}${overdue?' (ვადაგადაცილებული)':''}</span>
          <span class="wt-progress-wrap"><div class="wt-progress-bar"><div class="wt-progress-fill" style="width:${t.progress}%"></div></div>${t.progress}%</span>
          ${t.comments.length ? `<span>💬 ${t.comments.length}</span>` : ''}
          ${t.attachments.length ? `<span>📎 ${t.attachments.length}</span>` : ''}
        </div>
        ${t.comments.length ? `<div class="wt-inline-comments">
          ${t.comments.map(c=>`
            <div class="wt-inline-comment">
              <span class="wt-comment-author">${escapeHtml(c.author_name||'')}</span>
              <span class="wt-comment-date">${formatGeorgianDate(c.created_at.slice(0,10))}</span>
              <div class="wt-comment-text">${escapeHtml(c.text)}</div>
            </div>
          `).join('')}
        </div>` : ''}
      </div>
      <div class="wt-actions">
        <button class="btn-icon" data-wt-open="${t.id}" title="გახსნა">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        ${isAdmin() ? `<button class="btn-icon danger" data-wt-delete="${t.id}" title="წაშლა">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-1 0v14H9V6"/></svg>
        </button>` : ''}
      </div>
    </div>`;
  }

  wrap.innerHTML = groups.map(g=>`
    <div class="wt-employee-group">
      <div class="wt-employee-header">
        <span class="wt-employee-name">👤 ${escapeHtml(g.name)}</span>
        <span class="wt-employee-count">${g.tasks.length} დავალება</span>
      </div>
      <div class="wt-employee-tasks">
        ${g.tasks.map(renderTaskCard).join('')}
      </div>
    </div>
  `).join('');

  wrap.querySelectorAll('[data-wt-open]').forEach(el=>{
    el.onclick = ()=> openWorkTaskModal(el.getAttribute('data-wt-open'));
  });
  wrap.querySelectorAll('[data-jump-to-order]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const orderId = el.getAttribute('data-jump-to-order');
      expanded[orderId] = true;
      switchPage('gantt');
      setTimeout(()=>{
        const rowEl = document.querySelector(`.order-row[data-order="${orderId}"]`);
        if(rowEl) rowEl.scrollIntoView({ behavior:'smooth', block:'center' });
      }, 150);
    };
  });
  wrap.querySelectorAll('[data-wt-delete]').forEach(el=>{
    el.onclick = async ()=>{
      if(!confirm('წავშალო ეს დავალება?')) return;
      try{ await deleteWorkTaskRemote(el.getAttribute('data-wt-delete')); await loadWorkTasks(); renderTasksPage(); }
      catch(e){ alert('წაშლა ვერ მოხერხდა: ' + (e.message||'')); }
    };
  });
  wrap.querySelectorAll('[data-wt-done]').forEach(el=>{
    el.onclick = (e)=> e.stopPropagation();
    el.onchange = async ()=>{
      const taskId = el.getAttribute('data-wt-done');
      const task = workTasks.find(x=>x.id===taskId);
      if(!task) return;
      const newStatus = el.checked ? 'დასრულებული' : 'გასაკეთებელი';
      const newProgress = el.checked ? 100 : 0;
      try{
        await updateWorkTaskStatusProgress(task, newStatus, newProgress);
        await loadWorkTasks();
        renderTasksPage();
      }catch(err){ alert('განახლება ვერ მოხერხდა: ' + (err.message||'')); el.checked = !el.checked; }
    };
  });
}

function formatGeorgianDate(iso){
  if(!iso) return '';
  const d = parseISO(iso);
  return `${d.getDate()} ${MONTHS_KA[d.getMonth()]} ${d.getFullYear()}`;
}

async function updateWorkTaskStatusProgress(task, status, progress){
  if(canEdit()){
    const { error } = await sb.from('work_tasks').update({ status, progress, updated_at:new Date().toISOString() }).eq('id', task.id);
    if(error) throw error;
  } else if(isMyWorkTask(task)){
    const { error } = await sb.rpc('update_own_work_task', { p_task_id: task.id, p_status: status, p_progress: progress });
    if(error) throw error;
  } else {
    throw new Error('ამ დავალების შეცვლის უფლება არ გაქვთ');
  }
}

async function saveWorkTask(payload, existingId){
  const row = {
    title: payload.title, task_type: payload.task_type, employee: payload.employee,
    priority: payload.priority, due_date: payload.due_date || null,
    status: payload.status, progress: payload.progress, notes: payload.notes,
    order_id: payload.order_id || null, furniture_unit: payload.furniture_unit || null,
    updated_at: new Date().toISOString()
  };
  if(existingId){
    const { error } = await sb.from('work_tasks').update(row).eq('id', existingId);
    if(error) throw error;
    return existingId;
  } else {
    row.created_by = currentUser.id;
    const { data, error } = await sb.from('work_tasks').insert(row).select().single();
    if(error) throw error;
    return data.id;
  }
}
async function deleteWorkTaskRemote(id){
  const { error } = await sb.from('work_tasks').delete().eq('id', id);
  if(error) throw error;
}
async function addWorkTaskComment(taskId, text){
  const authorName = currentProfile.display_name || currentProfile.email || 'მომხმარებელი';
  const { error } = await sb.from('work_task_comments').insert({
    work_task_id: taskId, author_id: currentUser.id, author_name: authorName, comment_text: text
  });
  if(error) throw error;
}
async function deleteWorkTaskComment(commentId){
  const { error } = await sb.from('work_task_comments').delete().eq('id', commentId);
  if(error) throw error;
}
async function uploadWorkTaskAttachments(taskId, files){
  for(const file of files){
    try{
      const safeName = file.name.replace(/[^a-zA-Z0-9.\-_ ]/g, '_');
      const path = `${taskId}/${Date.now()}_${safeName}`;
      const { error: upErr } = await sb.storage.from(WT_ATTACHMENTS_BUCKET).upload(path, file);
      if(upErr) throw upErr;
      const { error: dbErr } = await sb.from('work_task_attachments').insert({
        work_task_id: taskId, file_path: path, file_name: file.name, file_size: file.size, uploaded_by: currentUser.id
      });
      if(dbErr) throw dbErr;
    }catch(e){ alert(`"${file.name}" ატვირთვა ვერ მოხერხდა: ` + (e.message||'')); }
  }
}
async function deleteWorkTaskAttachment(attId, path){
  await sb.storage.from(WT_ATTACHMENTS_BUCKET).remove([path]);
  const { error } = await sb.from('work_task_attachments').delete().eq('id', attId);
  if(error) throw error;
}

/* ---------- computed range ---------- */
function computeRange(){
  const t = todayLocal();
  let dataMin=null, dataMax=null;
  orders.forEach(o=>{
    [o, ...o.tasks].forEach(item=>{
      const s = parseISO(item.start), e = parseISO(item.end);
      if(!dataMin || s<dataMin) dataMin=s;
      if(!dataMax || e>dataMax) dataMax=e;
    });
  });
  const paddedDataMin = dataMin ? addDays(dataMin,-3) : null;
  const paddedDataMax = dataMax ? addDays(dataMax,7) : null;
  const defaultMin = addDays(t,-4);  /* default window ≈ 4 weeks total */
  const defaultMax = addDays(t,23);
  const min = (paddedDataMin && paddedDataMin < defaultMin) ? paddedDataMin : defaultMin;
  const max = (paddedDataMax && paddedDataMax > defaultMax) ? paddedDataMax : defaultMax;
  return {start:min, end:max, days:diffDays(min,max)+1};
}

        });

        /* tasks with no furniture line at all */
        o.tasks.filter(t=> !t.furniture_unit).forEach(task=>{
          taskNum++;
          rowsHtml += renderTaskRow(o, task, range, dayW, `${orderNum}.${taskNum}`);
          rowCount++;
        });
      }
    });
  } else {
    let flatNum = 0;
    filtered.forEach(o=>{
      o.tasks.filter(task=> task.stage === stageFilter).forEach(task=>{
        flatNum++;
        rowsHtml += renderFlatTaskRow(o, task, range, dayW, flatNum);
        rowCount++;
      });
    });
  }

  if(rowCount === 0){
    let emptyMsg;
    if(query) emptyMsg = 'შედეგი ვერ მოიძებნა';
    else if(stageFilter !== 'all') emptyMsg = `"${stageFilter}" ეტაპი ჯერ არცერთ შეკვეთაში არ არის დამატებული`;
    else emptyMsg = (currentView === 'completed' ? 'დასრულებული პროექტი ჯერ არ არის' : 'მიმდინარე შეკვეთა არ არის');
    html += `<div class="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v3M16 4v3"/></svg>
      <div>${emptyMsg}</div>
    </div>`;
  } else {
    html += rowsHtml;
  }

  // today line + tag, appended once, positioned across full content
  const todayX = diffDays(range.start, t) * dayW;
  const sideW = getSidebarWidth();
  inner.innerHTML = html;
  inner.style.position = 'relative';

  const line = document.createElement('div');
  line.className = 'today-line';
  line.style.left = (sideW + todayX) + 'px';
  line.style.height = inner.scrollHeight + 'px';
  inner.appendChild(line);

  const tag = document.createElement('div');
  tag.className='today-tag';
  tag.textContent='დღეს';
  tag.style.left = (sideW + todayX) + 'px';
  inner.appendChild(tag);

  attachRowEvents();

  if(wrap){
    if(_isFirstRender){
      /* open the view centered near today, leaving room to scroll back into the past */
      wrap.scrollLeft = Math.max(0, todayX - 220);
      _isFirstRender = false;
    } else if(prevScrollLeft !== null){
      /* keep the user's current scroll position after edits, instead of jumping back */
      wrap.scrollLeft = prevScrollLeft;
      wrap.scrollTop = prevScrollTop;
    }
  }
}

function renderMonths(range, dayW){
  let html='', cursor=new Date(range.start), remaining=range.days;
  while(remaining>0){
    const monthEnd = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
    const daysInSpan = Math.min(diffDays(cursor, monthEnd), remaining);
    html += `<div class="ruler-month" style="width:${daysInSpan*dayW}px">${MONTHS_KA[cursor.getMonth()]} ${cursor.getFullYear()}</div>`;
    cursor = monthEnd; remaining -= daysInSpan;
  }
  return `<div class="ruler-months">${html}</div>`;
}
function renderDays(range, dayW, t){
  let html='';
  for(let i=0;i<range.days;i++){
    const d = addDays(range.start, i);
    const isWeekend = d.getDay()===0 || d.getDay()===6;
    const isToday = diffDays(d,t)===0;
    html += `<div class="ruler-day ${isWeekend?'weekend':''} ${isToday?'today':''}" style="width:${dayW}px">${d.getDate()}</div>`;
  }
  return `<div class="ruler-days">${html}</div>`;
}

function barPos(item, range, dayW){
  const s = parseISO(item.start), e = parseISO(item.end);
  const left = diffDays(range.start, s) * dayW;
  const width = Math.max((diffDays(s,e)+1) * dayW - 4, 8);
  return {left, width};
}

/* Shows images and PDFs directly in-app (no new tab, no download) —
   in its own lightbox, separate from the main modal, so it doesn't
   disturb whatever edit form (task/order) is open underneath it.
   Any other file type still opens in a new tab, since the browser
   can't meaningfully preview it anyway. */
/* Cross-origin links (Supabase Storage lives on a different domain) ignore
   the <a download> attribute in most browsers, so downloads land with the
   storage path's internal filename instead of the real one. Fetching the
   file first and downloading it as a same-origin blob fixes that reliably. */
async function downloadAttachment(fileName, signedUrl){
  try{
    const resp = await fetch(signedUrl);
    if(!resp.ok) throw new Error('ფაილის მოტანა ვერ მოხერხდა');
    const blob = await resp.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=> URL.revokeObjectURL(blobUrl), 1000);
  }catch(e){
    alert('ჩამოტვირთვა ვერ მოხერხდა: ' + (e.message||''));
  }
}

function previewAttachment(fileName, signedUrl){
  const ext = (fileName.split('.').pop() || '').toLowerCase();
  const isImage = ['jpg','jpeg','png','gif','webp','bmp','svg'].includes(ext);
  const isPdf = ext === 'pdf';

  if(!isImage && !isPdf){
    downloadAttachment(fileName, signedUrl);
    return;
  }

  const box = document.getElementById('previewBox');
  box.style.maxWidth = isImage ? '720px' : '900px';
  box.innerHTML = `
    <div class="modal-head"><h3 style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(fileName)}</h3>
      <div style="display:flex;gap:6px;flex-shrink:0;">
        <button class="btn-icon" id="previewFullscreen" title="სრულ ეკრანზე">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m11-5v3a2 2 0 0 1-2 2h-3"/></svg>
        </button>
        <button class="btn-icon" id="previewDownload" title="ჩამოტვირთვა">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 19h16"/></svg>
        </button>
        <button class="btn-icon" id="previewClose"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
    </div>
    <div class="modal-body" style="padding:0;">
      ${isImage
        ? `<img src="${signedUrl}" style="width:100%;display:block;">`
        : `<iframe src="${signedUrl}" style="width:100%;height:78vh;border:none;display:block;"></iframe>`}
    </div>
  `;
  document.getElementById('previewOverlay').classList.add('open');
  document.getElementById('previewClose').onclick = closePreview;
  document.getElementById('previewDownload').onclick = ()=> downloadAttachment(fileName, signedUrl);
  document.getElementById('previewFullscreen').onclick = ()=>{
    if(!document.fullscreenElement){
      box.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen();
    }
  };
}
function closePreview(){
  if(document.fullscreenElement) document.exitFullscreen();
  document.getElementById('previewOverlay').classList.remove('open');
  document.getElementById('previewBox').innerHTML = '';
}
document.getElementById('previewOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'previewOverlay') closePreview();
});

/* ---------- drag-to-resize Gantt bars (order + task) ----------
   Delegated on document since #ganttInner's content is fully replaced
   on every render() — direct listeners on the handles wouldn't survive. */
let barDragJustHappened = false;
document.addEventListener('mousedown', (e)=>{
  const handle = e.target.closest('.bar-resize-handle');
  if(!handle || !canEdit()) return;
  e.preventDefault();
  e.stopPropagation();

  const bar = handle.closest('.bar');
  const side = handle.getAttribute('data-resize'); // 'left' or 'right'
  const orderAttr = bar.getAttribute('data-resize-order');
  const taskAttr = bar.getAttribute('data-resize-task');

  let entity = null, isOrder = false, taskOrderId = null;
  if(orderAttr){
    entity = orders.find(o=>o.id===orderAttr);
    isOrder = true;
  } else if(taskAttr){
    const [oId, tId] = taskAttr.split('|');
    const ord = orders.find(o=>o.id===oId);
    entity = ord ? ord.tasks.find(t=>t.id===tId) : null;
    taskOrderId = oId;
  }
  if(!entity) return;

  const dayW = getDayWidth();
  const startX = e.clientX;
  const origLeft = parseFloat(bar.style.left) || 0;
  const origWidth = parseFloat(bar.style.width) || dayW;
  const originalStart = parseISO(entity.start);
  const originalEnd = parseISO(entity.end);
  const totalDays = diffDays(originalStart, originalEnd);

  bar.classList.add('resizing');
  document.body.style.userSelect = 'none';
  let lastDeltaDays = 0;

  function onMove(ev){
    const deltaX = ev.clientX - startX;
    let deltaDays = Math.round(deltaX / dayW);
    if(side === 'left'){
      if(deltaDays > totalDays) deltaDays = totalDays; /* keep at least 1 day */
      bar.style.left = (origLeft + deltaDays*dayW) + 'px';
      bar.style.width = (origWidth - deltaDays*dayW) + 'px';
    } else {
      if(deltaDays < -totalDays) deltaDays = -totalDays;
      bar.style.width = (origWidth + deltaDays*dayW) + 'px';
    }
    lastDeltaDays = deltaDays;
  }

  async function onUp(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    bar.classList.remove('resizing');
    document.body.style.userSelect = '';
    barDragJustHappened = true;
    setTimeout(()=>{ barDragJustHappened = false; }, 50);

    if(lastDeltaDays === 0) return;

    const newStart = side === 'left' ? addDays(originalStart, lastDeltaDays) : originalStart;
    const newEnd = side === 'right' ? addDays(originalEnd, lastDeltaDays) : originalEnd;

    try{
      if(isOrder){
        await saveOrder({
          name: entity.name, client: entity.client,
          client_phone: entity.client_phone, client_address: entity.client_address,
          start: toISO(newStart), end: toISO(newEnd),
          color: entity.color, status: entity.status, responsible: entity.responsible, notes: entity.notes
        }, entity.id);
      } else {
        await saveTask(taskOrderId, {
          title: entity.title, stage: entity.stage,
          start: toISO(newStart), end: toISO(newEnd),
          color: entity.color, status: entity.status, employee: entity.employee,
          quantity: entity.quantity, contractor: entity.contractor, furniture_unit: entity.furniture_unit,
          notes: entity.notes
        }, entity.id);
      }
      await loadData();
    }catch(err){
      alert('თარიღის განახლება ვერ მოხერხდა: ' + (err.message||''));
      await loadData();
    }
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

  const order = orders.find(o=>o.id===orderId);

        <div class="err" id="errUnitName">გთხოვთ მიუთითოთ სახელი</div>
      </div>
      <div class="field"><label>მოცულობა</label>
        <input type="text" id="fUnitVolume" value="${escapeHtml(existingItem && existingItem.volume ? existingItem.volume : '')}" placeholder="მაგ. 3 ცალი, 12.5 მ²">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="mCancel">გაუქმება</button>
      <button class="btn btn-primary" id="mSave">${isEdit?'შენახვა':'დამატება'}</button>
    </div>
  `;
  overlay.classList.add('open');
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;

  const input = document.getElementById('fUnitName');
  input.focus();
  input.select();

  const submit = async ()=>{
    const name = input.value.trim();
    const volume = document.getElementById('fUnitVolume').value.trim();
    if(!name){ document.getElementById('errUnitName').style.display = 'block'; return; }
    document.getElementById('errUnitName').style.display = 'none';

    const saveBtn = document.getElementById('mSave');
    saveBtn.disabled = true;

    try{
      if(isEdit){
        if(!existingItem){ closeModal(); return; }
        const { error: updErr } = await sb.from('order_furniture_items')
          .update({ name, volume })
          .eq('id', existingItem.id);
        if(updErr) throw updErr;

        if(name !== existingName){
          const tasksToRename = order.tasks.filter(t=>t.furniture_unit === existingName);
          for(const t of tasksToRename){
            let newTitle = t.title;
            if(t.title && t.title.startsWith(existingName + ' — ')){
              newTitle = name + ' — ' + t.title.slice(existingName.length + 3);
            }
            const { error: taskErr } = await sb.from('tasks')
              .update({ furniture_unit: name, title: newTitle })
              .eq('id', t.id);
            if(taskErr) throw taskErr;
          }
        }
      } else {
        if((order.furnitureItems||[]).some(fi=>fi.name === name)){
          document.getElementById('errUnitName').textContent = 'ეს სახელი უკვე გამოყენებულია ამ შეკვეთაში';
          document.getElementById('errUnitName').style.display = 'block';
          saveBtn.disabled = false;
          return;
        }
        const color = SWATCHES[(order.furnitureItems||[]).length % SWATCHES.length];
        const { error: insErr } = await sb.from('order_furniture_items')
          .insert({ order_id: orderId, name, volume, color });
        if(insErr) throw insErr;
        expanded[orderId] = true;
      }

      await loadData();
      closeModal();
    }catch(e){
      alert('შენახვა ვერ მოხერხდა: ' + (e.message||''));
      saveBtn.disabled = false;
    }
  };

  document.getElementById('mSave').onclick = submit;
}

async function deleteFurnitureUnit(orderId, unitName){
  if(!canEdit()) return;
  const order = orders.find(o=>o.id===orderId);
  if(!order) return;
  const matchingTasks = order.tasks.filter(t=>t.furniture_unit === unitName);
  const msg = matchingTasks.length > 0
    ? `წავშალო "${unitName}" და მისი ${matchingTasks.length} ეტაპი? ეს მოქმედება ვერ გაუქმდება.`
    : `წავშალო "${unitName}"?`;
  if(!confirm(msg)) return;

  try{
    if(matchingTasks.length > 0){
      const { error: delTasksErr } = await sb.from('tasks')
        .delete().in('id', matchingTasks.map(t=>t.id));
      if(delTasksErr) throw delTasksErr;
    }
    const item = (order.furnitureItems||[]).find(fi=>fi.name === unitName);
    if(item){
      const { error: delItemErr } = await sb.from('order_furniture_items').delete().eq('id', item.id);
      if(delItemErr) throw delItemErr;
    }
    await loadData();
  }catch(e){ alert('წაშლა ვერ მოხერხდა: ' + (e.message||'')); }
}

    btn.disabled = true; btn.textContent = 'ინახება...';
    try{
      await saveTask(order.id, payload, existing ? existing.id : null);
      expanded[order.id] = true;
      await loadData();
      closeModal();
    }catch(e){
      alert('შენახვა ვერ მოხერხდა: ' + (e.message||''));
      btn.disabled = false; btn.textContent = existing?'შენახვა':'დამატება';
    }
  };
}

function buildSwatches(colorInput){
  const wrap = document.getElementById('swatches');
  wrap.innerHTML = SWATCHES.map(c=>`<div class="swatch ${c.toLowerCase()===colorInput.value.toLowerCase()?'active':''}" style="background:${c}" data-c="${c}"></div>`).join('');
  wrap.querySelectorAll('.swatch').forEach(sw=>{
    sw.onclick = ()=>{
      colorInput.value = sw.getAttribute('data-c');
      wrap.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
      sw.classList.add('active');
    };
  });
}

document.getElementById('btnNewWorkTask').onclick = ()=> openWorkTaskModal(null);
document.getElementById('searchInput').addEventListener('input', render);

document.getElementById('tabActive').onclick = ()=>{
  currentView = 'active';
  document.getElementById('tabActive').classList.add('active');
  document.getElementById('tabCompleted').classList.remove('active');
  _isFirstRender = true; /* re-center the view on today when switching tabs */
  if(currentPageView !== 'gantt') switchPage('gantt'); else render();
};
document.getElementById('tabCompleted').onclick = ()=>{
  currentView = 'completed';
  document.getElementById('tabCompleted').classList.add('active');
  document.getElementById('tabActive').classList.remove('active');
  _isFirstRender = true;
  if(currentPageView !== 'gantt') switchPage('gantt'); else render();
};

/* ---------- admin-only backup export ---------- */
async function exportData(){
  const btn = document.getElementById('btnExport');
  const prevLabel = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = 'ინახება...';
  try{
    const [
      { data: financeRows, error: fErr },
      { data: expenseRows, error: eErr },
      { data: advanceRows, error: aErr },
      { data: workTaskRows, error: wErr },
      { data: commentRows, error: cErr }
    ] = await Promise.all([
      sb.from('order_finance').select('*'),
      sb.from('order_expenses').select('*'),
      sb.from('order_advance_payments').select('*'),
      sb.from('work_tasks').select('*'),
      sb.from('work_task_comments').select('*')
    ]);
    if(fErr) throw fErr;
    if(eErr) throw eErr;
    if(aErr) throw aErr;
    if(wErr) throw wErr;
    if(cErr) throw cErr;

    const orderFinance = {};
    orders.forEach(o=>{ orderFinance[o.id] = { budget_total:null, furniture_size:null, advance_received:false, final_received:false, expenses:[], advancePayments:[] }; });
    (financeRows||[]).forEach(r=>{
      if(!orderFinance[r.order_id]) orderFinance[r.order_id] = { expenses:[], advancePayments:[] };
      orderFinance[r.order_id].budget_total = r.budget_total;
      orderFinance[r.order_id].furniture_size = r.furniture_size;
      orderFinance[r.order_id].advance_received = !!r.advance_received;
      orderFinance[r.order_id].final_received = !!r.final_received;
    });
    (expenseRows||[]).forEach(e=>{
      if(!orderFinance[e.order_id]) orderFinance[e.order_id] = { expenses:[], advancePayments:[] };
      if(!orderFinance[e.order_id].expenses) orderFinance[e.order_id].expenses = [];
      orderFinance[e.order_id].expenses.push({ id:e.id, description:e.description, amount:e.amount });
    });
    (advanceRows||[]).forEach(a=>{
      if(!orderFinance[a.order_id]) orderFinance[a.order_id] = { expenses:[], advancePayments:[] };
      if(!orderFinance[a.order_id].advancePayments) orderFinance[a.order_id].advancePayments = [];
      orderFinance[a.order_id].advancePayments.push({ id:a.id, description:a.description, amount:a.amount });
    });

    const workTasksExport = (workTaskRows||[]).map(w=>({
      id:w.id, title:w.title, task_type:w.task_type, employee:w.employee, priority:w.priority,
      due_date:w.due_date, status:w.status, progress:w.progress, notes:w.notes,
      comments: (commentRows||[]).filter(c=>c.work_task_id===w.id)
        .map(c=>({ id:c.id, author_name:c.author_name, text:c.comment_text, created_at:c.created_at }))
    }));

    const fullBackup = {
      exportedAt: new Date().toISOString(),
      note: 'ფაილის დანართები (ატვირთული ფოტოები/დოკუმენტები) ამ სარეზერვო ასლში არ შედის — ისინი ცალკე ინახება Supabase Storage-ში.',
      orders: orders,
      orderFinance: orderFinance,
      workTasks: workTasksExport
    };

    const blob = new Blob([JSON.stringify(fullBackup, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `gantt-sruli-sarezervo-${toISO(todayLocal())}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }catch(e){
    alert('სარეზერვო ასლის შექმნა ვერ მოხერხდა: ' + (e.message||''));
  }finally{
    btn.disabled = false;
    btn.innerHTML = prevLabel;
  }
}
document.getElementById('btnExport').onclick = exportData;
