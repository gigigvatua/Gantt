<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ავეჯის საწარმოს Gantt ცხრილი (ონლაინ, Supabase)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#FFFFFF;
  --panel:#FFFFFF;
  --ink:#111827;
  --ink-soft:#4B5563;
  --line:#E5E7EB;
  --line-soft:#F1F2F4;
  --blueprint:#4338CA;
  --mdf:#C99B5E;
  --mdf-dark:#A87D45;
  --rust:#B5502F;
  --sage:#5C7A6B;
  --stone:#9B968C;
  --danger:#B5502F;
  --radius:12px;
  --sidebar-w:300px;
  --day-w:30px;
}
html{height:100%;}
*{box-sizing:border-box;}
body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans Georgian','Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{
  max-width:100%;height:100vh;height:100dvh;display:flex;flex-direction:row;
}
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:24px 28px 20px;overflow:hidden;}
.app{position:relative;}
.main{margin-left:64px;}
.sidebar{
  position:absolute;left:0;top:0;bottom:0;z-index:40;
  width:64px;background:#F8FAFC;border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px;padding:22px 10px;overflow:hidden;
  transition:width .15s ease, box-shadow .15s ease;
}
.sidebar:hover{width:220px;padding:22px 14px;box-shadow:6px 0 24px rgba(17,24,39,.12);}
.sidebar .view-tab{font-size:0;white-space:nowrap;}
.sidebar:hover .view-tab{font-size:14px;}
.sidebar .tab-count{display:none;}
.sidebar:hover .tab-count{display:inline;font-size:12px;}
.sidebar .sb-name,.sidebar .user-badge{display:none;}
.sidebar:hover .sb-name{display:inline;}
.sidebar:hover .user-badge{display:flex;}
.sidebar .sb-user .btn{font-size:0;padding:9px 0;white-space:nowrap;}
.sidebar:hover .sb-user .btn{font-size:13.5px;padding:10px 16px;}
.sb-brand{white-space:nowrap;}
.sb-brand{display:flex;align-items:center;justify-content:center;padding:0 0 18px;}
.sb-logo-mark{width:44px;height:auto;border-radius:10px;display:block;}
.sb-logo-full{display:none;width:100%;height:auto;border-radius:12px;}
.sidebar:hover .sb-logo-mark{display:none;}
.sidebar:hover .sb-logo-full{display:block;}
.sb-logo{width:32px;height:32px;border-radius:9px;background:#4338CA;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;}
.sb-name{font-weight:700;font-size:18px;}
.sb-spacer{flex:1;}
.sb-user{border-top:1px solid var(--line);padding:12px 6px 0;margin-top:8px;display:flex;flex-direction:column;gap:8px;}
.sb-user .user-badge{flex-wrap:wrap;color:var(--ink);font-weight:600;}
.sb-user .btn{justify-content:center;}

/* ---- Header ---- */
.topbar{display:none;}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.logo-img{
  height:58px;width:auto;border-radius:14px;flex-shrink:0;
  box-shadow:0 1px 3px rgba(0,0,0,.15);
}
.title-block h1{
  font-family:'Noto Sans Georgian','Inter',sans-serif;
  font-size:26px;font-weight:700;margin:0 0 4px;
  letter-spacing:-.01em;
}
.title-block p{margin:0;color:var(--ink-soft);font-size:13.5px;}
.title-block .tag{
  display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;
  background:var(--blueprint);color:#fff;padding:2px 8px;border-radius:3px;
  letter-spacing:.03em;margin-bottom:8px;
}
.btn{
  font-family:'Noto Sans Georgian','Inter',sans-serif;font-weight:600;font-size:13.5px;
  border:none;border-radius:10px;padding:10px 16px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:transform .1s, box-shadow .15s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:#4338CA;color:#fff;border-radius:10px;}
.btn-primary:hover{box-shadow:0 3px 10px rgba(67,56,202,.35);}
.btn-ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink-soft);}
.btn-icon{
  width:28px;height:28px;padding:0;border-radius:5px;border:1px solid var(--line);
  background:var(--panel);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
}
.btn-icon:hover{background:var(--line-soft);}
.btn-icon.danger:hover{background:#f5e3dd;border-color:var(--rust);}

/* ---- Stats ---- */
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:8px;padding-left:16px;border-left:1px solid var(--line);}

/* ---- View tabs (sidebar items) ---- */
.view-tabs{display:flex;flex-direction:column;gap:4px;}
.view-tab{
  font-family:'Noto Sans Georgian','Inter',sans-serif;font-weight:500;font-size:14px;
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:10px 12px;border-radius:10px;border:none;
  background:transparent;color:var(--ink-soft);cursor:pointer;transition:background .12s,color .12s;
}
.view-tab svg{flex:none;}
.view-tab:hover{background:#EEF2FF;color:#3730A3;}
.view-tab.active{background:#EEF2FF;color:#3730A3;font-weight:600;}
.tab-count{margin-left:auto;font-size:12px;font-weight:600;background:transparent;padding:0;}

.page-nav{display:flex;gap:6px;}
.page-nav-btn{
  display:flex;align-items:center;gap:6px;font-family:'Noto Sans Georgian','Inter',sans-serif;font-weight:600;font-size:12.5px;
  padding:9px 14px;border-radius:7px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-soft);cursor:pointer;transition:all .12s;
}
.page-nav-btn:hover{border-color:var(--ink-soft);color:var(--ink);}
.page-nav-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.stat-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:6px 12px;min-width:90px;
}
.stat-card .num{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;}
.stat-card .lbl{font-size:10.5px;color:var(--ink-soft);margin-top:1px;}

/* ---- Toolbar ---- */
.toolbar{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-bottom:12px;flex-wrap:wrap;
}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid #D1D5DB;border-radius:10px;padding:7px 12px;min-width:240px;
}
.search-box input{
  border:none;outline:none;font-family:'Noto Sans Georgian','Inter',sans-serif;font-size:13.5px;
  width:100%;background:transparent;color:var(--ink);
}
.search-box svg{flex-shrink:0;opacity:.5;}

/* ---- Gantt wrap ---- */
#ganttPage{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;}
.gantt-wrap{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  overflow:auto;position:relative;
  flex:1 1 auto;min-height:0;
}
.gantt-inner{position:relative;width:max-content;min-width:100%;}

/* ---- Finance page ---- */
.finance-summary{
  display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;
  position:sticky;top:0;z-index:4;background:var(--bg);padding:6px 0 10px;
}
.finance-stat{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 20px;flex:1;min-width:160px;
}
.finance-stat .fs-lbl{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
.finance-stat .fs-val{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;}
.finance-stat.profit .fs-val.positive{color:var(--sage);}
.finance-stat.profit .fs-val.negative{color:var(--rust);}
.finance-table-wrap{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow-x:clip;overflow-y:visible;
}
.finance-table{width:100%;border-collapse:collapse;font-size:17.55px;}
.finance-table th{
  position:sticky;top:0;z-index:3;background:var(--panel);
  text-align:left;padding:11px 14px;border-bottom:2px solid var(--line);
  border-right:1px solid var(--line);
  font-family:'JetBrains Mono',monospace;font-size:13.65px;text-transform:uppercase;
  color:var(--ink-soft);letter-spacing:.03em;white-space:nowrap;
  box-shadow:0 1px 0 var(--line);
  overflow:hidden;text-overflow:ellipsis;
}
.finance-table th:last-child{border-right:none;}
.finance-table th.th-stacked{white-space:normal;overflow:visible;text-align:center;}
.th-stack-inner{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  text-align:center;width:100%;
}
.th-label{display:block;}
.finance-status-filter{
  display:block;margin-top:4px;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:none;
  letter-spacing:0;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:4px;
  padding:3px 4px;cursor:pointer;width:100%;max-width:100%;box-sizing:border-box;align-self:stretch;
}
.col-resize-handle{
  position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:6;
}
.col-resize-handle:hover, .col-resize-handle.resizing{background:var(--blueprint);opacity:.4;}
.th-total{
  font-family:'JetBrains Mono',monospace;font-size:16.9px;font-weight:700;
  text-transform:none;letter-spacing:0;color:var(--ink);margin-top:3px;white-space:nowrap;
}
.finance-table td{padding:11px 14px;border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;}
.finance-table td:last-child{border-right:none;}
.finance-editable{cursor:text;}
.finance-editable:hover{background:var(--line-soft);}
.finance-budget-input{
  width:100px;box-sizing:border-box;font-family:'JetBrains Mono',monospace;font-size:17.55px;font-weight:700;text-align:right;
  border:1px solid var(--blueprint);border-radius:4px;padding:3px 6px;background:#fff;
}
.finance-table tbody tr:hover{background:var(--line-soft);}
.finance-table .num-cell{font-family:'JetBrains Mono',monospace;text-align:right;white-space:nowrap;}
.finance-table th.num-cell{text-align:right;}
.finance-table th.num-cell.th-stacked{text-align:center;}
.finance-profit-positive{color:var(--sage);font-weight:700;}
.pay-check{color:var(--sage);font-weight:700;margin-left:3px;}
.payment-checkbox-row{display:flex;align-items:center;gap:8px;margin:8px 0 14px;}
.payment-checkbox-row label{font-size:13px;color:var(--ink);display:flex;align-items:center;gap:6px;cursor:pointer;}
.payment-checkbox-row input[type=checkbox]{width:16px;height:16px;cursor:pointer;}
.finance-profit-negative{color:var(--rust);font-weight:700;}
.finance-order-name{font-weight:400;}
.finance-order-client{font-size:13.8px;color:var(--ink-soft);}

.expense-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.expense-row{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  border:1px solid var(--line);border-radius:6px;background:#fbfaf6;
}
.expense-row .exp-desc{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text;border-radius:3px;padding:2px 4px;margin:-2px -4px;}
.expense-row .exp-desc:hover{background:var(--line-soft);}
.expense-row .exp-amt{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:var(--rust);cursor:text;border-radius:3px;padding:2px 4px;margin:-2px -4px;}
.expense-row .exp-amt:hover{background:var(--line-soft);}
.exp-desc-input{
  flex:1;min-width:0;font-size:12.5px;font-family:inherit;border:1px solid var(--blueprint);border-radius:3px;padding:2px 4px;background:#fff;
}
.exp-amt-input{
  width:80px;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:var(--rust);
  border:1px solid var(--blueprint);border-radius:3px;padding:2px 4px;background:#fff;
}
.expense-row .exp-cat{
  flex-shrink:0;font-size:11px;font-weight:600;color:var(--blueprint);background:var(--line-soft);
  border:1px solid var(--line);border-radius:20px;padding:3px 9px;cursor:pointer;white-space:nowrap;
}
.expense-row .exp-cat:hover{border-color:var(--blueprint);}
.exp-cat-select{
  flex-shrink:0;font-size:11px;font-weight:600;color:var(--blueprint);border:1px solid var(--blueprint);
  border-radius:20px;padding:3px 7px;background:#fff;
}
.expense-add-row{display:flex;gap:8px;align-items:center;}
.expense-add-row .field{flex:1;margin-bottom:0;}
.expense-add-row input, .expense-add-row select{
  width:100%;height:38px;box-sizing:border-box;padding:0 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff;
}
.expense-add-row .btn{height:38px;box-sizing:border-box;padding:0 16px;}
.expense-add-row .btn-icon{width:38px;height:38px;flex-shrink:0;}
.exp-cat-add-btn{flex-shrink:0;}
.expcat-row{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  border:1px solid var(--line);border-radius:6px;background:#fbfaf6;
}
.expcat-row .expcat-name{flex:1;min-width:0;font-size:12.5px;cursor:text;border-radius:3px;padding:2px 4px;margin:-2px -4px;}
.expcat-row .expcat-name:hover{background:var(--line-soft);}

/* ---------- ხარჯთაღრიცხვა (Cost Estimate) ---------- */
.ce-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
.ce-header h2{margin:0 0 4px;font-family:'Noto Sans Georgian','Inter',sans-serif;font-size:20px;}
.ce-volume{font-weight:400;color:var(--ink-soft);font-size:15px;}
.ce-sub{color:var(--ink-soft);font-size:13.5px;}
.ce-section{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:16px;
}
.ce-section h4{margin:0 0 10px;font-size:13.5px;font-weight:700;}
.ce-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px;}
.ce-table th{
  text-align:left;padding:6px 8px;border-bottom:2px solid var(--line);
  font-size:10px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.02em;
}
.ce-table td{padding:6px 8px;border-bottom:1px solid var(--line-soft);}
.ce-table .rnum{text-align:right;font-family:'JetBrains Mono',monospace;white-space:nowrap;}
.ce-table .rmuted{color:var(--ink-soft);font-style:italic;}
.ce-cell{cursor:text;border-radius:3px;}
.ce-cell:hover{background:var(--line-soft);}
.ce-inline-input{
  width:100%;font-size:13px;font-family:inherit;border:1px solid var(--blueprint);border-radius:3px;padding:2px 5px;
}
.ce-add-row{display:flex;gap:6px;align-items:center;position:relative;}
.ce-add-row input{
  padding:6px 9px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;min-width:0;
}
.ce-section-total{
  text-align:right;font-size:13px;color:var(--ink-soft);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
}
.ce-autocomplete{
  position:absolute;top:100%;left:0;right:0;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:20;max-height:220px;overflow-y:auto;display:none;
}
.ce-autocomplete-item{padding:7px 10px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--line-soft);}
.ce-autocomplete-item:last-child{border-bottom:none;}
.ce-autocomplete-item:hover{background:var(--line-soft);}
.ce-ac-meta{color:var(--ink-soft);font-size:11px;float:right;}
.ce-summary{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;
}
.summary-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;}
.summary-row.total{border-top:2px solid var(--ink);margin-top:6px;padding-top:12px;font-weight:700;font-size:16px;}
.ce-pct-grid{
  display:grid;grid-template-columns:repeat(5, 1fr) auto;gap:10px;align-items:end;
  margin-bottom:16px;padding-bottom:16px;border-bottom:1px dashed var(--line);
}
.ce-pct-grid .field{margin-bottom:0;}
.ce-pct-grid input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px;font-size:13px;}
.ce-pct-grid label{font-size:11px;color:var(--ink-soft);display:block;margin-bottom:4px;}
.cat-brand{font-size:11.5px;color:var(--ink-soft);min-width:60px;cursor:text;border-radius:3px;padding:2px 4px;margin:-2px -4px;}
.cat-brand:hover{background:var(--line-soft);}

.row{display:flex;border-bottom:1px solid var(--line-soft);}
.row:last-child{border-bottom:none;}

.side{
  position:sticky;left:0;z-index:3;width:var(--sidebar-w);flex-shrink:0;
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:0 10px;
}
.side.head{z-index:6;}
.side::after{content:"";position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:7;}
.side:not(.head)::after{display:block;}
body.sw-drag,body.sw-drag *{cursor:col-resize!important;user-select:none!important;}
.side.head:hover::after,body.sw-drag .side::after{background:rgba(67,56,202,.18);}


.timeline{position:relative;flex-shrink:0;}

/* header */
.head-row{position:sticky;top:0;z-index:4;background:var(--panel);}
.ruler{position:relative;}
.ruler-months{display:flex;height:26px;border-bottom:1px solid var(--line);}
.ruler-month{
  flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink-soft);
  display:flex;align-items:center;padding-left:6px;border-right:1px dashed var(--line);
  letter-spacing:.02em;
}
.ruler-days{display:flex;height:30px;}
.ruler-day{
  flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line-soft);
  position:relative;
}
.ruler-day::before{
  content:"";position:absolute;top:0;left:50%;width:1px;height:4px;background:var(--line);
}
.ruler-day.weekend{background:var(--line-soft);}
.ruler-day.today{background:#EEF2FF;color:#4338CA;font-weight:700;}

/* order / task rows */
.order-row .side{height:56px;background:#fff;}
.task-row .side{height:44px;}
.furniture-group-row{background:#F8FAFC;}
.furniture-group-row .side{height:34px;background:#F8FAFC;border-right:1px solid var(--line);gap:6px;}
.furniture-group-label{
  font-size:14px;font-weight:700;color:var(--mdf-dark);text-transform:uppercase;letter-spacing:.03em;
}
.order-row .timeline{height:56px;}
.row.zebra,.row.zebra .side,.order-row.zebra .side{background:#F1F2F4;}
.task-row .timeline{height:44px;}

.chev{
  width:32px;height:32px;flex-shrink:0;border:none;background:transparent;cursor:pointer;border-radius:8px;
  color:var(--ink-soft);display:flex;align-items:center;justify-content:center;transition:transform .15s;
}
.chev.collapsed{transform:rotate(-90deg);}
.chev svg{width:24px;height:24px;stroke-width:2.8;}
.chev:hover{background:rgba(0,0,0,.06);color:var(--ink);}

.row-num{
  flex-shrink:0;width:30px;text-align:right;font-family:'JetBrains Mono',monospace;
  font-size:13px;font-weight:700;color:var(--ink-soft);
}
.row-num.sub-num{width:34px;font-size:12px;font-weight:600;color:var(--stone);}

.name-block{flex:1;min-width:0;}
.name-block .nm{
  font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.name-block .sub{
  font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.task-row .name-block .nm{font-weight:500;font-size:14px;}

.name-block .nm .note-dot{display:none;}
.badge{
  font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;
  padding:3px 10px;border-radius:4px;color:#fff;white-space:nowrap;letter-spacing:.02em;
  box-shadow:0 1px 2px rgba(0,0,0,.25);
}
.side .status-dot,.finance-table .status-dot{font-size:0;gap:0;}
.side .row-actions{display:none;position:absolute;right:6px;top:50%;transform:translateY(-50%);background:var(--panel);padding:3px;border-radius:8px;box-shadow:0 2px 10px rgba(17,24,39,.18);z-index:5;}
.side:hover .row-actions{display:flex;}
.side .row-actions:empty,.side:hover .row-actions:empty{display:none!important;}
@media (hover:none){ .side .row-actions{display:flex;position:static;transform:none;box-shadow:none;padding:0;} }
.status-dot{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;}
.status-dot .sd{width:24px;height:24px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;}
.status-dot .sd svg{width:13px;height:13px;}
.row-actions{display:flex;gap:4px;flex-shrink:0;}

/* project ribbon (all stages in one row) */
.rib-bg{position:absolute;inset:0;}
.modal-del{opacity:.35;margin-right:auto;}
.modal-del:hover{opacity:1;color:#DC2626;background:#FEE2E2;}
.stage-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.stage-chip-btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px 4px 4px;font:600 12.5px 'Noto Sans Georgian','Inter',sans-serif;color:var(--ink);cursor:pointer;transition:background .12s,border-color .12s,opacity .12s;}
.stage-chip-btn .sc-n{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#1F2937;}
.stage-chip-btn .sc-c{font-weight:500;opacity:.6;font-size:11.5px;}
.stage-chip-btn:hover{border-color:#9CA3AF;}
.stage-chip-btn.on{border-color:var(--sc);background:var(--sc);}
.stage-chip-btn.on .sc-n{background:rgba(255,255,255,.65);}
.stage-chips.has-on .stage-chip-btn:not(.on){opacity:.55;}
.stage-chip-clear{border:none;background:none;color:var(--ink-soft);font:500 12px 'Noto Sans Georgian','Inter',sans-serif;cursor:pointer;text-decoration:underline;padding:4px 6px;}
.rib-seg{position:absolute;top:15px;height:26px;border-radius:13px;display:flex;align-items:center;gap:5px;padding:0 10px;
  font-size:12px;font-weight:700;color:#1F2937;white-space:nowrap;overflow:hidden;cursor:pointer;z-index:1;box-shadow:0 0 0 1px rgba(255,255,255,.7);}
.open-end{border-right:3px dashed rgba(31,41,55,.55)!important;}
.rib-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;}
.rib-ok{margin-left:auto;font-weight:800;}
.rib-ov{position:absolute;top:15px;height:26px;border-radius:6px;z-index:2;pointer-events:none;}
.stage-chip{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#1F2937;margin-left:6px;}
/* bars */
.bar{
  position:absolute;top:9px;border-radius:10px;overflow:hidden;cursor:pointer;
  box-shadow:0 1px 2px rgba(17,24,39,.12);border:none;
  min-width:6px;transition:filter .1s;
}
.bar-resize-handle{
  position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:5;
}
.bar-resize-handle.left{left:0;}
.bar-resize-handle.right{right:0;}
.bar-resize-handle:hover{background:rgba(255,255,255,.4);}
.bar.resizing{transition:none;filter:brightness(1.08);}
.order-row .bar{height:38px;}
.task-row .bar{height:26px;top:9px;}
.bar:hover{filter:brightness(1.06);}
.bar .edge{display:none;}
.bar .lbl{
  position:absolute;inset:0 10px;display:flex;align-items:center;font-size:12.5px;font-weight:600;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 2px rgba(0,0,0,.35);
  letter-spacing:.01em;
}
.task-row .bar .lbl{
  font-size:12px;inset:5px 5px 0;color:var(--ink);font-weight:700;
  text-shadow:0 1px 2px rgba(255,255,255,.85), 0 0 5px rgba(255,255,255,.6);
}
.bar.task-bar{border-width:2px;}

.today-line{
  position:absolute;top:0;width:0;border-left:2px dashed #4338CA;z-index:2;pointer-events:none;
}
.today-tag{
  position:absolute;font-family:'JetBrains Mono',monospace;font-size:9px;color:#fff;
  background:#4338CA;padding:2px 8px;border-radius:999px;top:52px;transform:translateX(-50%);white-space:nowrap;
}

.empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);}
.empty-state svg{opacity:.35;margin-bottom:10px;}

/* ---- Login screen ---- */
#loginScreen{
  position:fixed;inset:0;background:var(--bg);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
#loginScreen.hidden{display:none;}
.login-card{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  width:100%;max-width:380px;padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.12);
}
.login-card h1{font-family:'Noto Sans Georgian','Inter',sans-serif;font-size:20px;margin:0 0 6px;}
.login-card p{color:var(--ink-soft);font-size:13px;margin:0 0 22px;}
.login-card .field{margin-bottom:14px;}
.login-card .field label{
  display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.03em;
}
.login-card input{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;
  font-family:'Noto Sans Georgian','Inter',sans-serif;font-size:14px;color:var(--ink);background:#fff;
}
.login-card input:focus{outline:none;border-color:var(--blueprint);}
.login-card .btn{width:100%;justify-content:center;padding:11px;margin-top:6px;}
.login-err{color:var(--rust);font-size:12.5px;margin-top:10px;display:none;}
.login-toggle{
  text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:16px;
}
.login-toggle a{color:var(--blueprint);cursor:pointer;font-weight:600;text-decoration:none;}

/* ---- User / role badge in topbar ---- */
.user-badge{
  display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-soft);
}
.user-badge .role-pill{
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:3px 8px;
  border-radius:4px;color:#fff;letter-spacing:.02em;
}

/* ---- Modal ---- */
.overlay{
  position:fixed;inset:0;background:rgba(33,30,26,.5);display:none;
  align-items:center;justify-content:center;z-index:50;padding:20px;
}
.overlay.open{display:flex;}
.preview-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;
  align-items:center;justify-content:center;z-index:200;padding:20px;
}
.preview-overlay.open{display:flex;}
.preview-box{
  background:var(--panel);border-radius:10px;width:100%;max-width:480px;
  max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.preview-box:fullscreen{
  max-width:100%;width:100%;height:100%;max-height:100%;border-radius:0;
  display:flex;flex-direction:column;background:#111;
}
.preview-box:fullscreen .modal-head{background:#111;border-color:#333;color:#fff;}
.preview-box:fullscreen .modal-head .btn-icon{color:#fff;}
.preview-box:fullscreen .modal-body{
  flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;
}
.preview-box:fullscreen .modal-body img{width:auto;max-width:100%;max-height:100%;object-fit:contain;}
.preview-box:fullscreen .modal-body iframe{width:100%;height:100%;}
.modal{
  background:var(--panel);border-radius:10px;width:100%;max-width:480px;
  max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal-head{
  padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:5;background:var(--panel);
}
.modal-head h3{margin:0;font-family:'Noto Sans Georgian','Inter',sans-serif;font-size:17px;}
.modal-body{padding:20px 22px;}
#modalContent{position:relative;}
.modal-grip{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;z-index:10;touch-action:none;background:linear-gradient(135deg,transparent 0 55%,var(--ink-soft) 55% 60%,transparent 60% 72%,var(--ink-soft) 72% 77%,transparent 77% 88%,var(--ink-soft) 88% 93%,transparent 93%);opacity:.6;}
.modal-grip:hover{opacity:1;}
@media (max-width:700px){.modal-grip{display:none;}}
#modalContent{display:flex;flex-direction:column;overflow:hidden;}
#modalContent>.modal-head,#modalContent>.modal-foot{flex:0 0 auto;}
#modalContent>.modal-body{flex:1 1 auto;min-height:0;overflow-y:auto;}
.field{margin-bottom:15px;}
.field label{
  display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.03em;
}
.field input[type=text],.field select,.field input[type=date],.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;
  font-family:'Noto Sans Georgian','Inter',sans-serif;font-size:13.5px;color:var(--ink);background:#fff;
}
.field textarea{resize:vertical;min-height:60px;font-family:'Noto Sans Georgian','Inter',sans-serif;}
.field input[type=text]:focus,.field select:focus,.field input[type=date]:focus,.field textarea:focus{
  outline:none;border-color:var(--blueprint);
}
.row2{display:flex;gap:12px;}
.row2 .field{flex:1;}
.color-row{display:flex;align-items:flex-start;gap:10px;}
.color-row input[type=color]{
  width:44px;height:34px;border:1px solid var(--line);border-radius:6px;padding:2px;cursor:pointer;background:#fff;
}
.swatches{display:flex;gap:6px;flex-wrap:wrap;max-width:230px;}
.swatch{
  width:22px;height:22px;border-radius:5px;cursor:pointer;border:2px solid transparent;
}
.swatch.active{border-color:var(--ink);}
.err{color:var(--rust);font-size:12px;margin-top:4px;display:none;}
.modal-foot{
  padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;
  position:sticky;bottom:0;z-index:5;background:var(--panel);
}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:-8px;margin-bottom:14px;}

/* ---- Order modal: two-column layout (general info + files | furniture units) ---- */
.modal-two-col{display:flex;align-items:flex-start;gap:22px;}
.modal-col-left{flex:1 1 300px;min-width:0;}
.modal-col-right{flex:1 1 300px;min-width:0;border-left:1px solid var(--line);padding-left:22px;}
.furn-col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.furn-col-head h4{margin:0;font-family:'Noto Sans Georgian','Inter',sans-serif;font-size:13.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);}
.furn-list{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding-right:2px;}
.furn-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;}
.furn-card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.furn-card-head input[type=text]{
  flex:1;min-width:0;padding:6px 8px;border:1px solid transparent;border-radius:5px;
  font-family:'Noto Sans Georgian','Inter',sans-serif;font-size:13.5px;font-weight:600;color:var(--ink);background:transparent;
}
.furn-card-head input[type=text]:hover,.furn-card-head input[type=text]:focus{border-color:var(--line);background:#fff;outline:none;}
.furn-card-head .btn-icon{flex-shrink:0;}
.furn-card-volume{margin-bottom:2px;}
.furn-card-volume input[type=text]{
  width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;
  font-family:'Noto Sans Georgian','Inter',sans-serif;font-size:12.5px;color:var(--ink-soft);background:#fff;
}
.furn-add-row{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:#fbfaf6;}
.furn-add-row input[type=text]{
  width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px;
  font-family:'Noto Sans Georgian','Inter',sans-serif;font-size:12.5px;color:var(--ink);background:#fff;margin-bottom:8px;
}
.furn-empty-hint{font-size:12px;color:var(--ink-soft);text-align:center;padding:14px 0;}

/* ---- Fixed-pipeline stage rows (measuring/design/material/furniture/assembly/
   transportation/installation) — each row summarizes one task and opens the
   full task editor (with its dates, responsible, contractor & files) on click,
   creating the task on first click if it doesn't exist yet. ---- */
.stage-list{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;}
.stage-row{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;
  border:1px solid var(--line);background:#fff;
}
.stage-row:hover{border-color:var(--blueprint);background:#F7FAFF;}
.stage-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.stage-row-label{font-size:12.5px;font-weight:600;color:var(--ink);flex-shrink:0;}
.stage-row-summary{
  font-size:11px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;
}
.stage-row-chevron{flex-shrink:0;color:var(--ink-soft);}
.furn-card .stage-list{margin-top:8px;}
@media (max-width:760px){
  .modal-two-col{flex-direction:column;}
  .modal-col-right{border-left:none;padding-left:0;border-top:1px solid var(--line);padding-top:18px;margin-top:4px;}
}

/* ---- Tasks & Assignments page ---- */
.wt-list-wrap{display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1 1 auto;min-height:0;padding-right:2px;}
.wt-employee-group{
  background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:14px;margin-bottom:4px;
}
.wt-employee-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--line);
}
.wt-employee-name{font-family:'Noto Sans Georgian','Inter',sans-serif;font-weight:700;font-size:15px;color:var(--ink);}
.wt-employee-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);}
.wt-employee-tasks{display:flex;flex-direction:column;gap:8px;}
.wt-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;display:flex;align-items:flex-start;gap:14px;
}
.wt-card.done{opacity:.55;}
.wt-check{width:22px;height:22px;flex-shrink:0;margin-top:2px;cursor:pointer;}
.wt-main{flex:1;min-width:0;}
.wt-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px;}
.wt-title{font-weight:700;font-size:14.5px;}
.wt-type{font-size:11.5px;color:var(--ink-soft);}
.wt-meta-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-top:8px;}
.wt-priority-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;color:#fff;}
.wt-status-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;color:#fff;}
.wt-progress-wrap{display:flex;align-items:center;gap:6px;}
.wt-progress-bar{width:110px;height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden;}
.wt-progress-fill{height:100%;background:var(--blueprint);}
.wt-actions{display:flex;gap:6px;flex-shrink:0;align-items:center;}
.wt-due-overdue{color:var(--rust);font-weight:700;}
.wt-employee-select{
  font-size:12px;padding:3px 6px;border-radius:4px;border:1px solid var(--line);background:#fff;color:var(--ink);
}
.wt-order-link{
  font-size:12px;font-weight:600;color:var(--blueprint);background:#e8eef2;border-radius:6px;
  padding:4px 9px;margin-top:6px;display:inline-block;cursor:pointer;transition:background .12s;
}
.wt-order-link:hover{background:#d7e2e9;}
.wt-inline-notes{
  font-size:12.5px;color:var(--ink);background:var(--bg);border-radius:6px;
  padding:6px 10px;margin-top:6px;white-space:pre-wrap;
}
.wt-inline-comments{
  margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
  display:flex;flex-direction:column;gap:6px;
}
.wt-inline-comment{background:var(--bg);border-radius:6px;padding:7px 10px;}
.wt-comment-row{padding:8px 0;border-bottom:1px solid var(--line-soft);}
.wt-comment-row:last-child{border-bottom:none;}
.wt-comment-author{font-weight:700;font-size:12px;}
.wt-comment-date{font-size:10.5px;color:var(--ink-soft);margin-left:6px;}
.wt-comment-text{font-size:13px;margin-top:2px;white-space:pre-wrap;}


/* ---- Attachments ---- */
.attachments-list{display:flex;flex-direction:column;gap:6px;}
.attachment-row{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  border:1px solid var(--line);border-radius:6px;background:#fbfaf6;
}
.attachment-row .att-name{
  flex:1;min-width:0;font-size:12.5px;font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
}
.attachment-row .att-name:hover{color:var(--blueprint);text-decoration:underline;}
.att-thumb{flex-shrink:0;width:34px;height:34px;border-radius:5px;border:1px solid var(--line);background:#efece3;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;}
.att-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.att-thumb-ext{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:var(--ink-soft);}
.attachment-row .att-size{font-size:11px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;flex-shrink:0;}

/* ============================================================
   RESPONSIVE / MOBILE
   ============================================================ */
@media (max-width: 768px){
  :root{ --sidebar-w:220px; }

  .app{ flex-direction:column; }
  .main{ margin-left:0; }
  .sidebar,.sidebar:hover{ position:static; box-shadow:none; width:100%; flex-direction:row; align-items:center; padding:8px; gap:6px; border-right:none; border-bottom:1px solid var(--line); overflow-x:auto; }
  .sb-brand,.sb-spacer{ display:none; }
  .view-tabs{ flex-direction:row; }
  .sidebar .view-tab,.sidebar:hover .view-tab{ width:auto; white-space:nowrap; padding:8px 10px; font-size:12.5px; }
  .sidebar .tab-count{ display:inline; font-size:11px; }
  .sidebar .user-badge{ display:flex; }
  .sidebar .sb-user .btn{ font-size:0; padding:8px 10px; }
  .sb-user{ border:none; padding:0; margin:0; flex-direction:row; align-items:center; }
  .main{ padding:12px 12px 10px; }

  .topbar{ align-items:flex-start; gap:10px; }
  .brand{ gap:10px; }
  .logo-img{ height:40px; }
  .title-block h1{ font-size:18px; }
  .title-block p{ font-size:11px; }
  .title-block p span{ display:block; margin-top:2px; }

  #btnNewOrder span.label{ display:none; }
  .btn{ padding:9px 12px; font-size:12.5px; }

  .user-badge{ font-size:11px; gap:6px; }
  .user-badge .role-pill{ font-size:9px; padding:2px 6px; }

  .stats{ gap:6px; margin:2px 0 0; padding-left:0; border-left:none; flex-basis:100%; }
  .stat-card{ flex:1 1 auto; min-width:86px; padding:8px 10px; }
  .stat-card .num{ font-size:16px; }
  .stat-card .lbl{ font-size:10px; }

  .view-tabs{ gap:6px; margin-bottom:10px; }
  .view-tab{ flex:1; text-align:center; padding:8px 6px; font-size:11.5px; }

  .toolbar{ flex-direction:column; align-items:stretch; gap:8px; }
  .search-box{ min-width:0; width:100%; }
  .toolbar > div:last-child{ width:100%; justify-content:space-between; }

  .side{ padding:0 6px; gap:5px; }
  .task-row .side{ padding-left:22px; }
  .name-block .nm{ font-size:13px; }
  .name-block .sub{ font-size:11px; }
  .badge{ font-size:9.5px; padding:2px 6px; }
  .btn-icon{ width:30px; height:30px; }
  .row-actions{ gap:2px; }

  .modal{ max-width:100%; }
  .overlay{ padding:0; align-items:flex-end; }
  .modal{ border-radius:14px 14px 0 0; max-height:92vh; max-height:92dvh; }
  .row2{ flex-direction:column; gap:0; }
  .modal-body{ padding:16px 16px; }
  .modal-head{ padding:14px 16px; }
  .modal-foot{ padding:12px 16px; }

  .login-card{ padding:24px 20px; }
}

@media (max-width: 480px){
  :root{ --sidebar-w:170px; }
  .order-row .side{ height:58px; }
  .task-row .side{ height:46px; }
  .order-row .bar{ height:38px; }
  .task-row .bar{ height:26px; }
  .name-block .sub{ display:none; }
  .title-block p{ font-size:10px; }
  .stat-card{ min-width:70px; padding:7px 8px; }
  .stat-card .num{ font-size:14px; }
}

.stages-locked{opacity:.35;pointer-events:none;user-select:none;filter:grayscale(.3);}
.hcheck{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding-bottom:10px;cursor:pointer;white-space:nowrap;}
.hcheck input{width:16px;height:16px;cursor:pointer;}

/* paper-card task view */
.paper-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;align-items:start;padding:6px 2px 24px;}
.paper-card{border-radius:10px;padding:14px 16px 10px;box-shadow:0 1px 2px rgba(0,0,0,.18),0 8px 18px rgba(0,0,0,.10);color:#2b2a27;}
.paper-white{background:#fdfdfb;}
.paper-cream{background:#f3efe3;}
.paper-kraft{background:#d9c3a1;}
.paper-head{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;min-height:38px;padding-bottom:6px;border-bottom:1.5px solid rgba(60,55,45,.35);margin-bottom:2px;font-family:ui-monospace,Menlo,Consolas,monospace;}
.paper-name{font-size:17px;font-weight:600;letter-spacing:.02em;text-align:center;grid-column:2;font-family:'Noto Sans Georgian','Inter',sans-serif;font-weight:700;}
.paper-head .paper-ico{grid-column:1;margin:0;display:flex;align-items:center;justify-content:center;}
.paper-head .paper-ico svg,.paper-head .paper-ico img{width:34px!important;height:34px!important;object-fit:contain;margin:0!important;}
.paper-count{grid-column:3;text-align:right;}
.paper-count{font-size:11px;opacity:.55;}
.paper-line{display:flex;align-items:flex-start;gap:10px;min-height:46px;padding:7px 2px 6px;border-bottom:1px solid rgba(60,55,45,.22);position:relative;}
.paper-empty{align-items:center;}
.paper-check{appearance:none;-webkit-appearance:none;flex:0 0 17px;width:17px;height:17px;margin:2px 0 0;border:1.5px solid rgba(60,55,45,.55);border-radius:50%;background:transparent;cursor:pointer;position:relative;}
.paper-check.ghost{display:inline-block;opacity:.45;cursor:default;margin:0;}
.paper-check:checked{background:#2f6b4f;border-color:#2f6b4f;}
.paper-check:checked::after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
.paper-main{flex:1;min-width:0;}
.paper-title[data-open-order]{cursor:pointer;}.paper-title[data-open-order]:hover{text-decoration:underline;}
.paper-title{font-size:14px;font-weight:600;line-height:1.3;overflow-wrap:anywhere;}
.paper-ico{display:inline-block;width:34px;height:34px;margin-right:6px;flex-shrink:0;}
.paper-ico img{width:34px!important;height:34px!important;margin:0!important;}
.paper-sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:11.5px;opacity:.75;margin-top:2px;}
.paper-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.paper-link{cursor:pointer;text-decoration:underline dotted;}
.paper-notes{font-size:12px;opacity:.7;margin-top:2px;}
.paper-line.done .paper-title{text-decoration:line-through;}
.paper-line.done .paper-main{opacity:.45;transition:opacity .15s;}
.paper-line.done:hover .paper-main{opacity:.8;}
.paper-del{border:none;background:transparent;font-size:18px;line-height:1;cursor:pointer;opacity:0;color:#8a2b1c;padding:0 4px;position:absolute;right:0;top:6px;z-index:2;}
.paper-line .paper-title{padding-right:18px;}
.paper-line:hover .paper-del{opacity:.8;}
.paper-person{font-size:12.5px;margin-top:3px;}
.paper-extra{opacity:.65;}
.paper-files{display:flex;flex-direction:column;gap:2px;margin-top:4px;}
.paper-file{font-size:12px;cursor:pointer;text-decoration:underline dotted;overflow-wrap:anywhere;}
.paper-recv{column-gap:12px;display:grid;grid-template-columns:minmax(0,1fr) 118px;align-items:center;margin-top:8px;font-size:13px;font-weight:600;}
.paper-recv>span{text-align:left;white-space:normal;line-height:1.25;}
.paper-recv>.paper-recv-date{width:118px;min-width:0;padding:4px 3px;font-size:11.5px;box-sizing:border-box;justify-self:end;}
.paper-recv>.paper-check{justify-self:end;}
.need-date{outline:2px solid #e11d48 !important;outline-offset:1px;animation:needDateFade 1.8s ease-out forwards;}
@keyframes needDateFade{0%,70%{outline-color:#e11d48}100%{outline-color:transparent}}
.paper-recv-date{font:inherit;font-weight:400;font-size:12.5px;padding:4px 6px;border:1px solid rgba(60,55,45,.35);border-radius:6px;background:rgba(255,255,255,.55);}
.paper-recv .paper-check{margin:0;}

/* horizontal stage rows */
.hstage{display:flex;align-items:flex-start;gap:18px;padding:14px 0;border-top:1px solid var(--line);}
#stagesWrap > .hstage .hstage-label{color:#1F2937;}
#stagesWrap > .hstage{padding:14px 14px;margin-top:8px;border-top:none;border-radius:12px;}
/* variant E: slim panel with a coloured icon rail */
#stagesWrap > .hstage{--sc:#ccc;align-items:stretch;display:grid;grid-template-columns:104px minmax(0,1fr);gap:0;padding:0;overflow:hidden;margin-top:10px;}
#stagesWrap > .hstage:nth-child(1){--sc:#86E3CE;}#stagesWrap > .hstage:nth-child(2){--sc:#D0E6A5;}#stagesWrap > .hstage:nth-child(3){--sc:#FFDD94;}#stagesWrap > .hstage:nth-child(4){--sc:#FA897B;}#stagesWrap > .hstage:nth-child(5){--sc:#CCABD8;}#stagesWrap > .hstage:nth-child(6){--sc:#6C8CBF;}#stagesWrap > .hstage:nth-child(7){--sc:#BAC94A;}
#stagesWrap > .hstage{background:color-mix(in srgb,var(--sc) 38%,#fff);}
#stagesWrap > .hstage > .hstage-label{flex:none;padding:14px 4px;background:var(--sc);display:flex;align-items:flex-start;justify-content:center;}
#stagesWrap > .hstage > .hstage-label > div{display:flex;flex-direction:column;align-items:center;gap:4px;}
#stagesWrap > .hstage > .hstage-label > div > div:last-child{order:-1;margin:0!important;position:relative;}
#stagesWrap > .hstage > .hstage-label > div > div:first-child{display:inline;font-size:12px;}
#stagesWrap > .hstage > .hstage-label > div > div:nth-child(2){font-size:12px!important;font-weight:800;white-space:normal!important;text-align:center;line-height:1.15;}
#stagesWrap .hstage-label img,#stagesWrap .hstage-label svg{width:40px!important;height:40px!important;object-fit:contain;}
#stagesWrap > .hstage > .hstage-body{padding:10px 14px;}
.stg-bdg{position:absolute;right:-8px;top:-6px;width:20px;height:20px;border-radius:50%;border:2px solid #fff;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;line-height:1;}
.stg-bdg.ok{background:#10b981;}.stg-bdg.wip{background:#0ea5e9;font-size:10px;}
.hstage-label{flex:0 0 150px;font-weight:600;font-size:15px;color:#C98A1B;padding-top:22px;}
.hstage-num{font-weight:700;margin-right:2px;}
.hstage-body{flex:1;min-width:0;}
.hstage-sr{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;}
.hstage-sr .hfield,.hfield{margin:0;min-width:140px;}
.hstage-note{font-size:12px;color:var(--ink-soft);padding-bottom:10px;}
.hstage-filebtn{white-space:nowrap;}
.hstage-files{flex-basis:100%;margin-top:2px;}
.htop{margin-bottom:10px;}
.htop2{margin-bottom:6px;}
.hstage-split{padding:0;gap:0;}
.hstage-split .hstage-half{flex:1;display:flex;align-items:flex-start;gap:18px;padding:14px 0;min-width:0;}
.hstage-split .hstage-half-r{border-left:1px solid var(--line);padding-left:18px;}
.hfurn-list{max-height:none !important;overflow:visible;}
.hfurn-head{gap:8px;}
.hfurn-head .furn-name-input{flex:2;}
.hfurn-head .furn-volume-input{flex:1;}
.hsub{display:flex;align-items:flex-start;gap:14px;padding:8px 0;border-top:1px dashed var(--line);}
.hsub-label{flex:0 0 170px;font-size:13px;font-weight:600;padding-top:24px;color:var(--ink);}
.hsub .hstage-sr{flex:1;}
@media (max-width:760px){
  .hstage,.hsub,.hstage-split,.hstage-split .hstage-half{flex-direction:column;gap:6px;}
  .hstage-label,.hsub-label{flex:none;padding-top:0;}
  .hstage-split .hstage-half-r{border-left:none;padding-left:0;}
}
</style>
</head>

const SWATCHES = ["#E63946","#F4A300","#FFD60A","#2EC4B6","#118AB2","#3A86FF","#7B2CBF","#D62828","#06A77D","#EF476F","#8338EC","#FB5607","#00B4D8","#4CC9F0","#495057"];
const MONTHS_KA = ["იან","თებ","მარ","აპრ","მაი","ივნ","ივლ","აგვ","სექ","ოქტ","ნოე","დეკ"];

/* ---- Tasks & Assignments ---- */

];
const PRIORITIES = ["დაბალი","საშუალო","მაღალი","გადაუდებელი"];
const PRIORITY_COLOR = { "დაბალი":"#6B7280", "საშუალო":"#2563EB", "მაღალი":"#F59E0B", "გადაუდებელი":"#E11D2E" };
const WORK_STATUSES = ["გასაკეთებელი","მიმდინარეობს","მოლოდინში","დასრულებული","გაუქმებული"];
const WORK_STATUS_COLOR = {
  "გასაკეთებელი":"#6B7280","მიმდინარეობს":"#2563EB","მოლოდინში":"#F59E0B",
  "დასრულებული":"#16A34A","გაუქმებული":"#374151"
};

let orders = [];
let expanded = {};
let expandedGroups = {}; /* key: `${orderId}|${unitName}` -> bool, default true (expanded) */
let currentView = 'active'; /* 'active' | 'paused' | 'completed' */
const stageChipSel = new Set(); /* selected stage numbers 0..6 — empty = all projects */
const CHIP_STAGES = ['აზომვა','ნახაზი','დადასტურება','მასალა','აწყობა','ტრანსპორტირება','მონტაჟი'];
let currentPageView = 'gantt'; /* 'gantt' | 'finance' */
let financeData = {}; /* order_id -> {budget_total, furniture_size, expenses:[{id,description,amount,category}]} */
let expenseCategories = []; /* [{id,name,seq}] — "ხარჯი" ჩამოსაშლელი სია */
let financeStatusFilter = 'active'; /* 'all' | 'active' | 'completed' — ფინანსების ცხრილის სტატუსით გაფილტვრა */
let financeExpenseCategoryFilter = 'all'; /* 'all' ან კატეგორიის სახელი — "ხარჯი" სვეტის კატეგორიით გაფილტვრა */
let workTasks = []; /* [{id,title,task_type,employee,priority,due_date,status,progress,notes,comments:[],attachments:[]}] */
let wtEmployeeFilter = 'all';
let wtStatusFilter = 'all';

function todayLocal(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); }
function toISO(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function diffDays(a,b){ return Math.round((b-a)/86400000); }
function uid(){ return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Lightens a hex color toward white by `amt` (0-1). Used so sub-task bars
   read as a clearly softer/lighter version of a color, distinct from the
   bold, full-strength color used for the parent order's bar. */
/* Default color per workflow stage (1–7) */
const STAGE_PALETTE = ['#86E3CE','#D0E6A5','#FFDD94','#FA897B','#CCABD8','#6C8CBF','#BAC94A'];
const STAGE_PALETTE_IDX = {
  "აზომვა":0, "ნახაზი":1, "დადასტურება":2, "განშლის გადაგზავნა":3,
  "მასალა":3, "ფურნიტურა":4, "აწყობა":4, "ტრანსპორტირება":5, "მონტაჟი":6
};
function stageColor(task){
  const i = STAGE_PALETTE_IDX[task.stage];
  return i === undefined ? task.color : STAGE_PALETTE[i];
}
function stageIdx(task){ const i = STAGE_PALETTE_IDX[task.stage]; return i === undefined ? 99 : i; }
function stageNum(task){ const i = stageIdx(task); return i === 99 ? '•' : String(i+1); }
/* Only stages with a REAL date are shown. Helper rows created with default dates are ignored:
   მასალა → only when "sent for cutting" is ticked (send date → preparation date); ფურნიტურა → never;
   აწყობა → only when assembly is started (from the start date until transport, if any). */
const REAL_DATE_STAGES = ['აზომვა','ნახაზი','დადასტურება','ტრანსპორტირება','მონტაჟი'];
const OPEN_END_STAGES = ['აზომვა','ნახაზი','დადასტურება','ტრანსპორტირება','მონტაჟი'];
/* A stage whose end date is not set runs up to today (until it is done or an end date is entered). */
function withOpenEnd(t){
  if(!t.end_open || !t.start) return t;
  const today = toISO(todayLocal());
  if(stageDone(t)) return Object.assign({}, t, { _open:true });
  const end = today >= t.start ? today : t.start;
  return Object.assign({}, t, { end, _open:true });
}
function realStageTasks(o){
  const all = o.tasks || [];
  const transports = all.filter(t=>t.stage==='ტრანსპორტირება').map(t=>t.start).sort();
  const out = [];
  all.forEach(t=>{
    if(REAL_DATE_STAGES.includes(t.stage)) out.push(withOpenEnd(t));
    else if(t.stage === 'ფურნიტურა') return;
    else if(t.stage === 'მასალა'){
      if((t.sent_for_cutting || t.material_received_date) && t.start){
        /* send date → received date (actual) if set, otherwise → preparation date (planned) */
        let end = (t.end && t.end >= t.start) ? t.end : t.start;
        if(t.material_received_date && t.material_received_date >= t.start) end = t.material_received_date;
        out.push(Object.assign({}, t, { end, _recv: t.material_received_date || '' }));
      }
    }
    else if(t.stage === 'აწყობა'){
      const finished = t.status === 'დასრულებული';
      if((t.assembly_started || finished) && t.start){
        let end = t.start;
        if(finished && t.end && t.end >= t.start) end = t.end;
        else {
          const nextT = transports.find(d=> d > t.start);
          if(nextT){ const d = addDays(parseISO(nextT), -1); end = toISO(d) >= t.start ? toISO(d) : t.start; }
        }
        out.push(Object.assign({}, t, { end }));
      }
    }
    else out.push(t);
  });
  return out;
}
function sortedStageTasks(tasks){
  return (tasks||[]).slice().sort((a,b)=> stageIdx(a)-stageIdx(b) || String(a.start).localeCompare(String(b.start)));
}
/* Project row: all real stages of the project as one ribbon; overlapping stages go to thin extra lanes */
function ribbonLayout(o, range, dayW){
  const segs = sortedStageTasks(realStageTasks(o)).map(t=>{
    const {left, width} = barPos(t, range, dayW);
    return { t, left, width: Math.max(width,8), color: stageColor(t) };
  }).sort((a,b)=> a.left - b.left || stageIdx(a.t)-stageIdx(b.t));
  const ends = [];
  segs.forEach(sg=>{
    let ln = ends.findIndex(e => sg.left >= e + 2);
    if(ln < 0){ ln = ends.length; ends.push(0); }
    ends[ln] = sg.left + sg.width;
    sg.lane = ln;
  });
  const lanes = Math.max(1, ends.length);
  return { segs, lanes, height: lanes === 1 ? 56 : Math.max(56, 18 + lanes*21) };
}
/* Which of the 7 stages a project is "in" today: the unfinished stage whose dates contain today;
   if none does, the next upcoming unfinished stage. Returns a stage index 0..6 or -1. */
function asmStartShown(t){ return t.assembly_started_date || (t.assembly_started ? (t.start||'') : ''); }
function stageDone(t){ return t.status==='დასრულებული' || !!t._recv || !!t.material_received || !!t.material_received_date || (t.stage==='ნახაზი' && !!t.design_approved) || (t.stage==='აზომვა' && t.attachmentCount>0); }
function effStatus(t){ return stageDone(t) ? 'დასრულებული' : t.status; }
function currentStageIdx(o){
  const today = toISO(todayLocal());
  const segs = realStageTasks(o).filter(t=>t.start && stageIdx(t) < 7 && !stageDone(t));
  const act = segs.filter(t=> t.start <= today && (t.end||t.start) >= today).map(stageIdx);
  if(act.length) return Math.min(...act);
  const up = segs.filter(t=> t.start > today).sort((a,b)=> a.start < b.start ? -1 : 1);
  return up.length ? stageIdx(up[0]) : -1;
}
function renderStageChips(base){
  const box = document.getElementById('stageChips');
  if(!box) return;
  const counts = new Array(7).fill(0);
  base.forEach(o=>{ realStageTasks(o).forEach(t=>{ const i = stageIdx(t); if(i>=0 && i<7) counts[i]++; }); });
  box.className = 'stage-chips' + (stageChipSel.size ? ' has-on' : '');
  box.innerHTML = CHIP_STAGES.map((n,i)=>`<button type="button" class="stage-chip-btn ${stageChipSel.has(i)?'on':''}" data-chip="${i}" style="--sc:${STAGE_PALETTE[i]};" title="${escapeHtml(n)} — ყველა მიმდინარე პროექტის „${escapeHtml(n)}“: ${counts[i]}"><span class="sc-n" style="background:${STAGE_PALETTE[i]};">${i+1}</span>${escapeHtml(n)} <span class="sc-c">${counts[i]}</span></button>`).join('') + (stageChipSel.size ? `<button type="button" class="stage-chip-clear" data-chip-clear>გასუფთავება</button>` : '');

function lightenColor(hex, amt){
  if(!hex) return hex;
  let h = hex.replace('#','');
  if(h.length === 3) h = h.split('').map(c=>c+c).join('');
  const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  if(isNaN(r) || isNaN(g) || isNaN(b)) return hex;
  const nr = Math.round(r + (255-r)*amt);
  const ng = Math.round(g + (255-g)*amt);
  const nb = Math.round(b + (255-b)*amt);
  return `rgb(${nr},${ng},${nb})`;
}

async function loadData(){
  updateStatusText('იტვირთება...');
  try{
    const [{ data: orderRows, error: oErr }, { data: taskRows, error: tErr }, { data: attRows, error: aErr }, { data: furnitureRows, error: fuErr }] = await Promise.all([
      sb.from('orders').select('*').order('seq', { ascending:true }),
      sb.from('tasks').select('*').order('seq', { ascending:true }),
      sb.from('task_attachments').select('task_id'),
      sb.from('order_furniture_items').select('*').order('seq', { ascending:true })
    ]);
    if(oErr) throw oErr;
    if(tErr) throw tErr;
    if(aErr) throw aErr;
    if(fuErr) throw fuErr;

    const attCounts = {};
    (attRows||[]).forEach(r=>{ attCounts[r.task_id] = (attCounts[r.task_id]||0) + 1; });

    const byId = {};
    orders = orderRows.map(o=>{ const ord = rowToOrder(o); byId[ord.id] = ord; return ord; });
    taskRows.forEach(t=>{ const ord = byId[t.order_id]; if(ord) ord.tasks.push(rowToTask(t, attCounts[t.id])); });
    (furnitureRows||[]).forEach(fi=>{
      const ord = byId[fi.order_id];
      if(ord) ord.furnitureItems.push({
        id: fi.id, name: fi.name, volume: fi.volume||'', color: fi.color||'',
        contingency_pct_override: fi.contingency_pct_override,
        overhead_pct_override: fi.overhead_pct_override,
        profit_pct_override: fi.profit_pct_override,
        discount_pct_override: fi.discount_pct_override,
        vat_pct_override: fi.vat_pct_override
      });
    });

    orders.forEach(o=>{ if(expanded[o.id] === undefined) expanded[o.id] = false; });
    updateStatusText(`დაკავშირებულია (${orders.length} შეკვეთა)`);
    render();
    if(currentPageView === 'tasks' && typeof renderTasksPage === 'function'){ try{ renderTasksPage(); }catch(_){} }  /* keep the Tasks cards in step with project data */

    console.error(e);
    updateStatusText('მონაცემების ჩატვირთვა ვერ მოხერხდა: ' + (e.message||''));
  }
}

const ATTACHMENTS_BUCKET = 'task-attachments';

function formatFileSize(bytes){
  if(!bytes && bytes !== 0) return '';
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

/* Small preview next to each uploaded file: image thumbnail, or a type badge (PDF, XLSX...). */
async function attachThumbs(listEl){
  const rows = Array.from(listEl.querySelectorAll('.attachment-row'));
  for(const row of rows){
    const nameEl = row.querySelector('.att-name');
    const icon = row.querySelector(':scope > svg');
    if(!nameEl || !icon) continue;
    const name = nameEl.getAttribute('title') || '';
    const ext = (name.split('.').pop() || '').toLowerCase();
    const isImg = ['png','jpg','jpeg','gif','webp','bmp','svg'].includes(ext);
    const box = document.createElement('span');
    box.className = 'att-thumb';
    if(isImg){
      box.textContent = '';
      icon.replaceWith(box);
      sb.storage.from(ATTACHMENTS_BUCKET).createSignedUrl(row.getAttribute('data-att-path'), 3600).then(({data})=>{
        if(data && data.signedUrl){ const im = document.createElement('img'); im.src = data.signedUrl; im.alt=''; im.loading='lazy'; box.appendChild(im); }
      }).catch(()=>{});
    } else {
      box.classList.add('att-thumb-ext');
      box.textContent = (ext && ext.length<=4 ? ext : 'FILE').toUpperCase();
      icon.replaceWith(box);
    }
  }
}

/* ---------- Finance page (admin/manager only) ---------- */
function formatMoney(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('ka-GE', { maximumFractionDigits: 2 }) + ' ₾';
}
function formatNumber(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('ka-GE', { maximumFractionDigits: 2 });
}

async function loadFinanceData(){
  try{
    const [{ data: financeRows, error: fErr }, { data: expenseRows, error: eErr }, { data: advanceRows, error: aErr }, { data: catRows, error: cErr }] = await Promise.all([
      sb.from('order_finance').select('*'),
      sb.from('order_expenses').select('*').order('created_at', { ascending:true }).order('id', { ascending:true }),
      sb.from('order_advance_payments').select('*').order('created_at', { ascending:true }).order('id', { ascending:true }),
      sb.from('expense_categories').select('*').order('seq', { ascending:true })
    ]);
    if(fErr) throw fErr;
    if(eErr) throw eErr;
    if(aErr) throw aErr;
    if(cErr) throw cErr;

    expenseCategories = catRows || [];

    financeData = {};
    orders.forEach(o=>{
      financeData[o.id] = { budget_total: null, furniture_size: null, advancePayments: [], advance_received: false, final_received: false, expenses: [] };
    });
    (financeRows||[]).forEach(r=>{
      if(!financeData[r.order_id]) financeData[r.order_id] = { budget_total:null, furniture_size:null, advancePayments:[], advance_received:false, final_received:false, expenses:[] };
      financeData[r.order_id].budget_total = r.budget_total;
      financeData[r.order_id].furniture_size = r.furniture_size;
      financeData[r.order_id].advance_received = !!r.advance_received;
      financeData[r.order_id].final_received = !!r.final_received;
    });
    (expenseRows||[]).forEach(e=>{
      if(!financeData[e.order_id]) financeData[e.order_id] = { budget_total:null, furniture_size:null, advancePayments:[], advance_received:false, final_received:false, expenses:[] };
      financeData[e.order_id].expenses.push({ id:e.id, description:e.description, amount:e.amount, category:e.category||'' });
    });
    (advanceRows||[]).forEach(a=>{
      if(!financeData[a.order_id]) financeData[a.order_id] = { budget_total:null, furniture_size:null, advancePayments:[], advance_received:false, final_received:false, expenses:[] };
      financeData[a.order_id].advancePayments.push({ id:a.id, description:a.description, amount:a.amount });
    });
  }catch(e){
    console.error('Finance load failed:', e);
    alert('ფინანსური მონაცემების ჩატვირთვა ვერ მოხერხდა: ' + (e.message||''));
  }
}

function calcExpensesTotal(orderId, category){
  const fd = financeData[orderId];
  if(!fd) return 0;
  const items = (!category || category === 'all') ? fd.expenses : fd.expenses.filter(e=> (e.category||'') === category);
  return items.reduce((sum,e)=> sum + (Number(e.amount)||0), 0);
}
function calcAdvanceTotal(orderId){
  const fd = financeData[orderId];
  if(!fd || !fd.advancePayments) return 0;
  return fd.advancePayments.reduce((sum,a)=> sum + (Number(a.amount)||0), 0);
}

function renderFinancePage(){
  const bodyEl = document.getElementById('financeTableBody');
  if(!bodyEl) return;

  const filteredOrders = orders.filter(o=>{
    if(financeStatusFilter === 'completed') return o.status === 'დასრულებული';
    if(financeStatusFilter === 'paused') return o.status === 'შეჩერებული';
    if(financeStatusFilter === 'active') return o.status !== 'დასრულებული' && o.status !== 'შეჩერებული';
    return true;
  });

  let totalBudget = 0, totalExpenses = 0, totalExpensesDisplay = 0, totalRemaining = 0, totalAdvanceCash = 0, totalAdvance = 0;
  const rowsHtml = filteredOrders.map((o, idx)=>{
    const fd = financeData[o.id] || { budget_total:null, furniture_size:null, advancePayments:[], advance_received:false, final_received:false, expenses:[] };
    const expTotal = calcExpensesTotal(o.id); /* სრული ხარჯი — ბიუჯეტის/მოგების გამოსათვლელად, კატეგორიის ფილტრის მიუხედავად */
    const expTotalDisplay = calcExpensesTotal(o.id, financeExpenseCategoryFilter); /* მხოლოდ "ხარჯი" სვეტში საჩვენებლად */
    const budget = Number(fd.budget_total) || 0;
    const advance = calcAdvanceTotal(o.id);
    const remaining = budget - advance;
    const advanceCash = advance - expTotal;
    const profit = budget - expTotal;
    totalBudget += budget; totalExpenses += expTotal; totalExpensesDisplay += expTotalDisplay; totalRemaining += remaining; totalAdvanceCash += advanceCash; totalAdvance += advance;
    const profitClass = profit > 0 ? 'finance-profit-positive' : (profit < 0 ? 'finance-profit-negative' : '');
    const advanceCashClass = advanceCash > 0 ? 'finance-profit-positive' : (advanceCash < 0 ? 'finance-profit-negative' : '');
    const finalIcon = fd.final_received ? '✓' : '';
    return `<tr>
      <td>${idx+1}</td>

      <td class="num-cell">${budget > 0 ? formatMoney(remaining) : '—'} ${finalIcon ? '<span class="pay-check" title="საბოლოო გადახდა მიღებულია">'+finalIcon+'</span>' : ''}</td>
      <td class="num-cell ${profitClass}">${(fd.budget_total !== null || expTotal>0) ? formatMoney(profit) : '—'}</td>
    </tr>`;
  }).join('');

  const totalProfit = totalBudget - totalExpenses;

  const thBudget = document.getElementById('thTotalBudget');
  const thAdvance = document.getElementById('thTotalAdvance');
  const thExpenses = document.getElementById('thTotalExpenses');
  const thAdvanceCash = document.getElementById('thTotalAdvanceCash');
  const thRemaining = document.getElementById('thTotalRemaining');
  const thProfit = document.getElementById('thTotalProfit');
  if(thBudget) thBudget.textContent = formatMoney(totalBudget);
  if(thAdvance) thAdvance.textContent = formatMoney(totalAdvance);

  if(thAdvanceCash){ thAdvanceCash.textContent = formatMoney(totalAdvanceCash); thAdvanceCash.style.color = totalAdvanceCash>=0 ? 'var(--sage)' : 'var(--rust)'; }
  if(thRemaining) thRemaining.textContent = formatMoney(totalRemaining);
  if(thProfit){ thProfit.textContent = formatMoney(totalProfit); thProfit.style.color = totalProfit>=0 ? 'var(--sage)' : 'var(--rust)'; }

  const emptyMsg = financeStatusFilter === 'completed' ? 'დასრულებული შეკვეთა არ არის'
    : financeStatusFilter === 'paused' ? 'შეჩერებული შეკვეთა არ არის'
    : financeStatusFilter === 'active' ? 'მიმდინარე შეკვეთა არ არის'
    : 'შეკვეთები არ არის';
  bodyEl.innerHTML = rowsHtml || `<tr><td colspan="9" style="text-align:center;color:var(--ink-soft);padding:30px;">${emptyMsg}</td></tr>`;

  const statusFilterSel = document.getElementById('financeStatusFilter');
  if(statusFilterSel){
    statusFilterSel.value = financeStatusFilter;
    statusFilterSel.onchange = ()=>{ financeStatusFilter = statusFilterSel.value; renderFinancePage(); };

  const expCatFilterSel = document.getElementById('financeExpenseCategoryFilter');

    expCatFilterSel.innerHTML = `<option value="all">ყველა</option>` +
      expenseCategories.map(c=>`<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join('');

    if(expCatFilterSel.value !== financeExpenseCategoryFilter) financeExpenseCategoryFilter = expCatFilterSel.value;
    expCatFilterSel.onchange = ()=>{ financeExpenseCategoryFilter = expCatFilterSel.value; renderFinancePage(); };

  bodyEl.querySelectorAll('[data-advance-edit]').forEach(el=>{
    el.onclick = ()=> openAdvancePaymentsModal(el.getAttribute('data-advance-edit'));
  });
  bodyEl.querySelectorAll('[data-expenses-edit]').forEach(el=>{
    el.onclick = ()=> openExpensesModal(el.getAttribute('data-expenses-edit'));
  });
  bodyEl.querySelectorAll('[data-print-report]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); printOrderFinanceReport(el.getAttribute('data-print-report')); };
  });
  bodyEl.querySelectorAll('[data-budget-edit]').forEach(el=>{
    el.onclick = ()=>{
      const orderId = el.getAttribute('data-budget-edit');
      const fd = financeData[orderId] || {};
      const currentVal = (fd.budget_total !== null && fd.budget_total !== undefined) ? fd.budget_total : '';
      const input = document.createElement('input');
      input.type = 'number'; input.step = '0.01'; input.value = currentVal;
      input.className = 'finance-budget-input';
      el.innerHTML = '';
      el.appendChild(input);
      input.focus(); input.select();

      let done = false;
      const commit = async ()=>{
        if(done) return;
        done = true;
        try{
          await saveOrderFinance(
            orderId,
            input.value,
            fd.furniture_size !== null && fd.furniture_size !== undefined ? fd.furniture_size : '',
            fd.advance_received,
            fd.final_received
          );
          await loadFinanceData();
          renderFinancePage();
        }catch(e){ alert('შენახვა ვერ მოხერხდა: ' + (e.message||'')); renderFinancePage(); }
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', ev=>{
        if(ev.key === 'Enter'){ ev.preventDefault(); input.blur(); }
        else if(ev.key === 'Escape'){ done = true; renderFinancePage(); }
      });
    };
  });

  initFinanceColumnResize();
}

/* სვეტების სიგანის ხელით გაწევა — ჩანაწერს ვცდით მხოლოდ ერთხელ, რადგან
   <thead> სტატიკურია და renderFinancePage() მხოლოდ <tbody>-ს ცვლის, ასე
   რომ უკვე დადებული სიგანეები და handle-ები ყოველ რენდერზე ინარჩუნებენ თავს. */
/* საწყისი სიგანეები % -ში, # ვიწროდ და შეკვეთა ფართოდ რომ იყოს ყოველთვის,
   მონაცემების ჩატვირთვის დროის მიუხედავად (არ ეყრდნობა offsetWidth-ის გაზომვას). */
const FINANCE_COLS_KEY = 'kabineti.financeColWidths.v1';
function saveFinanceColWidths(cols){
  try{ localStorage.setItem(FINANCE_COLS_KEY, JSON.stringify(cols.map(c=>Math.round(parseFloat(c.style.width)*100)/100))); }catch(e){}
}
function resetFinanceColWidths(){
  try{ localStorage.removeItem(FINANCE_COLS_KEY); }catch(e){}
  const cols = Array.from(document.querySelectorAll('.finance-table colgroup col'));
  cols.forEach((col, idx)=>{ col.style.width = FINANCE_COL_DEFAULT_WIDTHS[idx] || col.style.width; });
}
const FINANCE_COL_DEFAULT_WIDTHS = ['4%','22%','14%','10%','10%','14%','10%','10%','6%'];
/* ცხრილი ყოველთვის ეკრანს (finance-table-wrap-ის სიგანეს) ემთხვევა ზუსტად —
   არასდროს სქროლავს გვერდულად და არ გადის ეკრანის ფარგლებს გარეთ. სვეტების
   სიგანე <colgroup>-ის <col>-ებზეა, %-ში, ჯამში ყოველთვის 100%. ერთი სვეტის
   გაწევისას იცვლება მხოლოდ ის და მისი უშუალო მომდევნო სვეტი — ერთი იზრდება
   ზუსტად იმდენით, რამდენითაც მეორე მცირდება, ასე რომ ჯამური სიგანე (და
   ცხრილის მარჯვენა/მარცხენა კიდეები) უცვლელი რჩება. */
function initFinanceColumnResize(){
  const wrap = document.querySelector('.finance-table-wrap');
  const table = document.querySelector('.finance-table');
  if(!table || !wrap) return;
  const ths = Array.from(table.querySelectorAll('thead th'));
  const cols = Array.from(table.querySelectorAll('colgroup col'));
  if(!cols.length || !ths.length) return;

  if(!table.dataset.resizeInit){
    table.style.tableLayout = 'fixed';
    table.style.width = '100%';
    cols.forEach((col, idx)=>{ col.style.width = FINANCE_COL_DEFAULT_WIDTHS[idx] || col.style.width; });
    /* restore the widths this person saved earlier in this browser */
    try{
      const saved = JSON.parse(localStorage.getItem(FINANCE_COLS_KEY) || 'null');
      if(Array.isArray(saved) && saved.length === cols.length && saved.every(w=>typeof w==='number' && w>0)){
        const sum = saved.reduce((a,b)=>a+b,0);
        if(sum > 95 && sum < 105) cols.forEach((col, idx)=>{ col.style.width = saved[idx] + '%'; });
      }
    }catch(e){}
    table.dataset.resizeInit = '1';
  }

  ths.forEach((th, idx)=>{
    if(idx === ths.length - 1) return; /* ბოლო სვეტს handle არ სჭირდება */
    if(th.querySelector('.col-resize-handle')) return; /* უკვე დამატებულია */
    th.style.position = 'sticky';
    const handle = document.createElement('div');
    handle.className = 'col-resize-handle';
    th.appendChild(handle);
    handle.addEventListener('mousedown', (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const startX = e.clientX;
      const tableWidthPx = table.getBoundingClientRect().width;
      const thisPx = ths[idx].getBoundingClientRect().width;
      const nextPx = ths[idx+1].getBoundingClientRect().width;
      const minPx = 50;
      const maxDelta = Math.max(0, nextPx - minPx);   /* რამდენით შეიძლება გაიზარდოს ეს სვეტი */
      const minDelta = -Math.max(0, thisPx - minPx);  /* რამდენით შეიძლება შემცირდეს ეს სვეტი */
      handle.classList.add('resizing');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      function onMove(ev){
        let delta = ev.clientX - startX;
        delta = Math.max(minDelta, Math.min(maxDelta, delta));
        const newThisPx = thisPx + delta;
        const newNextPx = nextPx - delta;
        cols[idx].style.width = (newThisPx / tableWidthPx * 100) + '%';
        cols[idx+1].style.width = (newNextPx / tableWidthPx * 100) + '%';
      }
      function onUp(){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        handle.classList.remove('resizing');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        saveFinanceColWidths(cols);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

async function switchPage(page){
  if(page === 'finance' && !isAdmin()) return;
  currentPageView = page;

  document.getElementById('ganttPage').style.display = page === 'gantt' ? 'flex' : 'none';
  document.getElementById('financePage').style.display = page === 'finance' ? 'block' : 'none';
  document.getElementById('tasksPage').style.display = page === 'tasks' ? 'flex' : 'none';

  document.getElementById('tabActive').classList.toggle('active', page === 'gantt' && currentView === 'active');
  document.getElementById('tabPaused').classList.toggle('active', page === 'gantt' && currentView === 'paused');
  document.getElementById('tabCompleted').classList.toggle('active', page === 'gantt' && currentView === 'completed');
  document.getElementById('btnNavTasks').classList.toggle('active', page === 'tasks');
  document.getElementById('btnNavFinance').classList.toggle('active', page === 'finance');

  if(page === 'gantt'){
    render();
  } else if(page === 'finance'){
    updateStatusText('');
    await loadFinanceData();
    renderFinancePage();
  } else if(page === 'tasks'){
    updateStatusText('');
    await loadWorkTasks();
    renderTasksPage();
  }
}

async function saveOrderFinance(orderId, budgetTotal, furnitureSize, advanceReceived, finalReceived){
  const row = {
    order_id: orderId,
    budget_total: budgetTotal === '' ? null : Number(budgetTotal),
    furniture_size: furnitureSize === '' ? null : Number(furnitureSize),
    advance_received: !!advanceReceived,
    final_received: !!finalReceived,
    updated_at: new Date().toISOString()
  };
  const { error } = await sb.from('order_finance').upsert(row, { onConflict:'order_id' });
  if(error) throw error;
}

async function addExpenseEntry(orderId, description, amount, category){
  const { error } = await sb.from('order_expenses').insert({
    order_id: orderId, description, amount: Number(amount), category: category||null, created_by: currentUser.id
  });
  if(error) throw error;
}

async function deleteExpenseEntry(expenseId){
  const { error } = await sb.from('order_expenses').delete().eq('id', expenseId);
  if(error) throw error;
}

async function updateExpenseEntry(expenseId, description, amount, category){
  const patch = { description, amount: Number(amount) || 0 };
  if(category !== undefined) patch.category = category || null;
  const { error } = await sb.from('order_expenses').update(patch).eq('id', expenseId);
  if(error) throw error;
}

async function deleteAdvancePaymentEntry(paymentId){

}
async function updateAdvancePaymentEntry(paymentId, description, amount){

  if(error) throw error;
}

function makeEditableMoneyList(opts){
  const { listElId, getItems, updateFn, deleteFn, emptyText, deleteConfirmText, getCategories } = opts;
  function renderList(){
    const listEl = document.getElementById(listElId);
    if(!listEl) return;
    const items = getItems();
    if(!items.length){
      listEl.innerHTML = `<div class="hint" style="margin:0;">${emptyText}</div>`;
      return;
    }
    const cats = getCategories ? getCategories() : null;
    listEl.innerHTML = items.map(it=>`
      <div class="expense-row" data-item-id="${it.id}">
        ${cats ? `<span class="exp-cat" data-edit-cat="${it.id}" title="დააჭირეთ კატეგორიის შესაცვლელად">${escapeHtml(it.category || 'კატეგორია')}</span>` : ''}
        <span class="exp-desc" data-edit-desc="${it.id}" title="დააჭირეთ რედაქტირებისთვის — ${escapeHtml(it.description)}">${escapeHtml(it.description)}</span>
        <span class="exp-amt" data-edit-amt="${it.id}" title="დააჭირეთ რედაქტირებისთვის">${formatMoney(it.amount)}</span>
        <button type="button" class="btn-icon danger" data-item-delete="${it.id}" title="წაშლა">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-1 0v14H9V6"/></svg>
        </button>
      </div>
    `).join('');

    function startEditing(spanEl, itemId, field){
      const it = items.find(x=>x.id === itemId);
      if(!it) return;
      const currentValue = field === 'description' ? it.description : it.amount;
      const input = document.createElement('input');
      input.type = field === 'amount' ? 'number' : 'text';
      if(field === 'amount') input.step = '0.01';
      input.value = currentValue;
      input.className = field === 'amount' ? 'exp-amt-input' : 'exp-desc-input';
      spanEl.replaceWith(input);
      input.focus();
      input.select();

      let done = false;
      const commit = async ()=>{
        if(done) return;
        done = true;
        const newDesc = field === 'description' ? input.value.trim() || it.description : it.description;
        const newAmt = field === 'amount' ? input.value : it.amount;
        try{
          await updateFn(itemId, newDesc, newAmt, it.category);
          await loadFinanceData();
          renderList();
          renderFinancePage();
        }catch(err){ alert('განახლება ვერ მოხერხდა: ' + (err.message||'')); renderList(); }
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', ev=>{
        if(ev.key === 'Enter'){ ev.preventDefault(); input.blur(); }
        else if(ev.key === 'Escape'){ done = true; renderList(); }
      });
    }

    function startEditingCategory(spanEl, itemId){
      const it = items.find(x=>x.id === itemId);
      if(!it) return;
      const select = document.createElement('select');
      select.className = 'exp-cat-select';
      const names = cats.map(c=>c.name);
      if(it.category && !names.includes(it.category)) names.unshift(it.category);
      select.innerHTML = names.map(n=>`<option value="${escapeHtml(n)}" ${n===it.category?'selected':''}>${escapeHtml(n)}</option>`).join('');
      spanEl.replaceWith(select);
      select.focus();

      let done = false;
      const commit = async ()=>{
        if(done) return;
        done = true;
        try{
          await updateFn(itemId, it.description, it.amount, select.value);
          await loadFinanceData();
          renderList();
          renderFinancePage();
        }catch(err){ alert('განახლება ვერ მოხერხდა: ' + (err.message||'')); renderList(); }
      };
      select.addEventListener('change', commit);
      select.addEventListener('blur', ()=>{ if(!done){ done = true; renderList(); } });
    }

    if(cats){
      listEl.querySelectorAll('[data-edit-cat]').forEach(el=>{
        el.onclick = ()=> startEditingCategory(el, el.getAttribute('data-edit-cat'));
      });
    }
    listEl.querySelectorAll('[data-edit-desc]').forEach(el=>{
      el.onclick = ()=> startEditing(el, el.getAttribute('data-edit-desc'), 'description');
    });
    listEl.querySelectorAll('[data-edit-amt]').forEach(el=>{
      el.onclick = ()=> startEditing(el, el.getAttribute('data-edit-amt'), 'amount');
    });
    listEl.querySelectorAll('[data-item-delete]').forEach(el=>{
      el.onclick = async ()=>{
        if(!confirm(deleteConfirmText)) return;
        try{
          await deleteFn(el.getAttribute('data-item-delete'));
          await loadFinanceData();
          renderList();
          renderFinancePage();
        }catch(e){ alert('წაშლა ვერ მოხერხდა: ' + (e.message||'')); }
      };
    });
  }
  renderList();
  return renderList;
}

function openAdvancePaymentsModal(orderId){
